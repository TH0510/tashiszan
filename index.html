        if (count > changeAnswer) {
            await spillElement(chip, blank);
        } else {
            await flyFromTo(chip, blank);
            chip.remove();
        }
        changeEqTo.classList.add('shake');
        await wait(1400);
        changeEqTo.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        setChoicesEnabled(true);
        busy = false;
        applyDisplayMode();
    }

    function clearCountMode() {
        countMode = false;
        countPhase = 'idle';
        countShown = 0;
    }

    function plusTokkunTitle(key) {
        if (!key) return '';
        const parts = String(key).split('-');
        return `${parts[0]}+特訓その${parts[1]}`;
    }

    function isPlusCircleTokkun() {
        return playMode === 'add' && (fourPlusSpecial === '4-2' || fourPlusSpecial === '4-3');
    }

    function isFourPlusCircles() {
        return isPlusCircleTokkun() && isHintView();
    }

    function plusTokkunItems(key) {
        const [baseStr, partStr] = String(key).split('-');
        const base = Number(baseStr);
        const part = Number(partStr);
        let ns = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        if (base === 4) {
            if (part === 3) ns = shuffleInPlace(ns.slice());
            return ns.map((n) => ({ left: 4, right: n, solved: false }));
        }
        if (part === 2 || part === 4) ns = shuffleInPlace(ns.slice());
        const addendRight = part >= 3;
        return ns.map((n) => addendRight
            ? { left: base, right: n, solved: false }
            : { left: n, right: base, solved: false });
    }

    function fourPlusMaxPhase() {
        return rightNum <= 1 ? 2 : 4;
    }

    function fourPlusPrompt() {
        const n = rightNum;
        const rest = n - 1;
        const sum = 4 + n;
        if (fourPlusHintPhase === 1) return `<strong>4</strong> と <strong>${n}</strong>`;
        if (n > 1 && fourPlusHintPhase === 2) return `<strong>${n}</strong> を <strong>1</strong> と <strong>${rest}</strong> に わけるよ`;
        if ((n === 1 && fourPlusHintPhase === 2) || (n > 1 && fourPlusHintPhase === 3)) {
            return `<strong>4</strong> と <strong>1</strong> で <strong>5</strong>`;
        }
        if (n > 1 && fourPlusHintPhase === 4) return `<strong>5</strong> と <strong>${rest}</strong> で <strong>${sum}</strong>`;
        return `<strong>4</strong> たす <strong>${n}</strong> は いくつ？`;
    }

    function clearFourPlusMode() {
        fourPlusSpecial = null;
        fourPlusHintPhase = 0;
        fourPlusIndex = 1;
        if (fourCirclesEl) {
            fourCirclesEl.innerHTML = '';
            fourCirclesEl.hidden = true;
        }
        document.querySelectorAll('.four-dot.flying-dot').forEach((el) => el.remove());
    }

    function fourDotSize(n) {
        return Math.round(50 + n * 11);
    }

    function makeFourDot(n, color, id) {
        const el = document.createElement('div');
        el.className = 'four-dot ' + color;
        el.dataset.id = id;
        el.dataset.n = String(n);
        const size = fourDotSize(n);
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.fontSize = `${Math.max(22, Math.round(size * 0.42))}px`;
        el.textContent = String(n);
        return el;
    }

    function makeFourPlusSign() {
        const el = document.createElement('div');
        el.className = 'four-plus-sign';
        el.textContent = '+';
        return el;
    }

    function renderFourCircles(phase) {
        if (!fourCirclesEl) return;
        fourCirclesEl.innerHTML = '';
        fourCirclesEl.hidden = phase < 1;
        const n = rightNum;
        const rest = n - 1;
        if (phase < 1) return;
        if (phase === 1) {
            fourCirclesEl.append(makeFourDot(4, 'red', 'left'), makeFourPlusSign(), makeFourDot(n, 'blue', 'right'));
            return;
        }
        if (n === 1) {
            fourCirclesEl.append(makeFourDot(5, 'five', 'five'));
            return;
        }
        if (phase === 2) {
            fourCirclesEl.append(
                makeFourDot(4, 'red', 'left'),
                makeFourPlusSign(),
                makeFourDot(1, 'blue', 'one'),
                makeFourDot(rest, 'blue', 'rest')
            );
            return;
        }
        if (phase === 3) {
            fourCirclesEl.append(makeFourDot(5, 'five', 'five'), makeFourPlusSign(), makeFourDot(rest, 'blue', 'rest'));
            return;
        }
        fourCirclesEl.append(makeFourDot(4 + n, 'sum', 'sum'));
    }

    async function animateFourSplit() {
        const n = rightNum;
        const rest = n - 1;
        const src = fourCirclesEl && fourCirclesEl.querySelector('[data-id="right"]');
        if (!src || n <= 1) {
            renderFourCircles(2);
            return;
        }
        try {
            const origin = src.getBoundingClientRect();
            const originFont = getComputedStyle(src).fontSize;
            src.style.visibility = 'hidden';

            const size1 = fourDotSize(1);
            const size2 = fourDotSize(rest);
            const gap = 18;
            const cx = origin.left + origin.width / 2;
            const cy = origin.top + origin.height / 2;
            const r1 = { left: cx - gap / 2 - size1, top: cy - size1 / 2, width: size1, height: size1 };
            const r2 = { left: cx + gap / 2, top: cy - size2 / 2, width: size2, height: size2 };

            const makeFly = (keepNumber) => {
                const fly = makeFourDot(n, 'blue', 'split');
                fly.classList.add('flying-dot');
                fly.style.left = `${origin.left}px`;
                fly.style.top = `${origin.top}px`;
                fly.style.width = `${origin.width}px`;
                fly.style.height = `${origin.height}px`;
                fly.style.fontSize = originFont;
                if (!keepNumber) fly.textContent = '';
                document.body.appendChild(fly);
                return fly;
            };
            const fly1 = makeFly(true);
            const fly2 = makeFly(false);
            let labeled = false;
            const mix = (a, b, t) => a + (b - a) * t;
            const duration = 1080;
            const start = performance.now();

            const poseAt = (t) => {
                if (t < 0.16) {
                    const p = t / 0.16;
                    return { u: 0, squash: 1 - 0.12 * Math.sin(p * Math.PI), hop: 4 * p, pinch: 0 };
                }
                if (t < 0.46) {
                    const p = (t - 0.16) / 0.3;
                    return { u: 0.26 * p, squash: 0.84, hop: 0, pinch: p };
                }
                if (t < 0.7) {
                    const p = (t - 0.46) / 0.24;
                    const snap = p * p;
                    return {
                        u: 0.26 + 0.9 * snap,
                        squash: 0.82 + 0.06 * p,
                        hop: -22 * Math.sin(p * Math.PI),
                        pinch: 1 - p
                    };
                }
                const p = (t - 0.7) / 0.3;
                const settle = 1.16 + (1 - 1.16) * (1 - Math.pow(1 - p, 3));
                return {
                    u: settle,
                    squash: 1 - 0.18 * Math.sin(p * Math.PI) * (1 - p),
                    hop: 10 * (1 - p) * Math.sin(p * Math.PI * 2),
                    pinch: 0
                };
            };

            const place = (fly, toRect, newN, side, pose) => {
                const dx = toRect.left - origin.left;
                const dy = toRect.top - origin.top;
                const grow = Math.min(1, pose.u);
                const w = mix(origin.width, toRect.width, grow);
                const h = mix(origin.height, toRect.height, grow) * pose.squash;
                fly.style.left = `${origin.left + dx * pose.u}px`;
                fly.style.top = `${origin.top + dy * pose.u + pose.hop}px`;
                fly.style.width = `${w}px`;
                fly.style.height = `${h}px`;
                fly.style.borderRadius = pose.pinch > 0.05
                    ? (side === 'left' ? '46% 70% 70% 46%' : '70% 46% 46% 70%')
                    : '50%';
                if (!labeled && pose.u > 0.4) {
                    labeled = true;
                    fly1.textContent = '1';
                    fly1.style.fontSize = `${Math.max(22, Math.round(size1 * 0.42))}px`;
                    fly2.textContent = String(rest);
                    fly2.style.fontSize = `${Math.max(22, Math.round(size2 * 0.42))}px`;
                }
            };

            await new Promise((resolve) => {
                const tick = (now) => {
                    const t = Math.min(1, (now - start) / duration);
                    const pose = poseAt(t);
                    place(fly1, r1, 1, 'left', pose);
                    place(fly2, r2, rest, 'right', pose);
                    if (t < 1) requestAnimationFrame(tick);
                    else resolve();
                };
                requestAnimationFrame(tick);
            });

            fly1.remove();
            fly2.remove();
            renderFourCircles(2);
        } catch (err) {
            document.querySelectorAll('.four-dot.flying-dot').forEach((el) => el.remove());
            renderFourCircles(2);
        }
    }

    async function animateFourMerge(ids, nextPhase) {
        const dots = ids.map((id) => fourCirclesEl.querySelector(`[data-id="${id}"]`)).filter(Boolean);
        if (dots.length < 2) {
            renderFourCircles(nextPhase);
            return;
        }
        const n = nextPhase === 4 || (rightNum === 1 && nextPhase === 2) ? 4 + rightNum : 5;
        const targetSize = fourDotSize(n);
        const rects = dots.map((dot) => dot.getBoundingClientRect());
        const cx = rects.reduce((s, r) => s + r.left + r.width / 2, 0) / rects.length;
        const cy = rects.reduce((s, r) => s + r.top + r.height / 2, 0) / rects.length;
        const flies = dots.map((dot, i) => {
            const fly = dot.cloneNode(true);
            fly.classList.add('flying-dot');
            fly.style.left = `${rects[i].left}px`;
            fly.style.top = `${rects[i].top}px`;
            fly.style.width = `${rects[i].width}px`;
            fly.style.height = `${rects[i].height}px`;
            fly.style.fontSize = getComputedStyle(dot).fontSize;
            document.body.appendChild(fly);
            dot.style.visibility = 'hidden';
            return fly;
        });
        await Promise.all(flies.map((fly, i) => {
            const from = rects[i];
            const dx = cx - targetSize / 2 - from.left;
            const dy = cy - targetSize / 2 - from.top;
            return fly.animate([
                { transform: 'translate(0, 0) scale(1)', offset: 0 },
                { transform: `translate(${dx}px, ${dy}px) scale(${targetSize / from.width})`, offset: 1 }
            ], {
                duration: 700,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                fill: 'forwards'
            }).finished;
        }));
        flies.forEach((fly) => fly.remove());
        renderFourCircles(nextPhase);
    }

    async function onFourPlusHint() {
        if (busy || solved || !isFourPlusCircles()) return;
        const maxP = fourPlusMaxPhase();
        if (fourPlusHintPhase >= maxP) return;
        const next = fourPlusHintPhase + 1;
        const n = rightNum;
        if (next === 1) {
            fourPlusHintPhase = 1;
            renderFourCircles(1);
            messageEl.innerHTML = fourPlusPrompt();
            applyDisplayMode();
            return;
        }
        busy = true;
        updateHintButton();
        try {
            if (n === 1 && next === 2) {
                await animateFourMerge(['left', 'right'], 2);
            } else if (n > 1 && next === 2) {
                await animateFourSplit();
            } else if (n > 1 && next === 3) {
                await animateFourMerge(['left', 'one'], 3);
            } else if (n > 1 && next === 4) {
                await animateFourMerge(['five', 'rest'], 4);
            } else {
                renderFourCircles(next);
            }
            fourPlusHintPhase = next;
            messageEl.innerHTML = fourPlusPrompt();
        } finally {
            busy = false;
            applyDisplayMode();
        }
    }

    function startPlusTokkun(kind) {
        if (busy && !isFourPlusCircles()) return;
        document.querySelectorAll('.ball.flying, .four-dot.flying-dot, .num-chip').forEach((el) => el.remove());
        clearShiftMode();
        clearChangeMode();
        clearCountMode();
        huntTarget = null;
        huntItems = [];
        huntFocus = null;
        huntView = 'list';
        fourPlusSpecial = kind;
        fourPlusHintPhase = 0;
        busy = false;
        solved = false;
        hintPhase = 0;
        nextBtn.classList.add('hidden');
        drillCount = 9;
        drillView = 'list';
        drillFocus = null;
        drillItems = plusTokkunItems(kind);
        if (drillItems[0]) {
            leftNum = drillItems[0].left;
            rightNum = drillItems[0].right;
            lastLeft = leftNum;
            lastRight = rightNum;
        }
        choicesEl.classList.add('hidden');
        setChoicesEnabled(true);
        renderFourCircles(0);
        kastensEl.innerHTML = '';
        renderDrillList();
        applyDisplayMode();
    }

    function pickCountPair() {
        const pairs = [];
        for (let small = 1; small <= 3; small++) {
            for (let large = small + 1; large <= 9; large++) {
                if (large + small > 10) continue;
                pairs.push([large, small]);
            }
        }
        let choices = pairs;
        if (lastLeft !== null && pairs.length > 1) {
            const filtered = pairs.filter(([large, small]) => {
                const same = (lastLeft === large && lastRight === small)
                    || (lastLeft === small && lastRight === large);
                return !same;
            });
            if (filtered.length) choices = filtered;
        }
        const [large, small] = choices[randInt(0, choices.length - 1)];
        if (Math.random() < 0.5) return [large, small];
        return [small, large];
    }

    function setBallNumber(ball, n) {
        if (!ball) return;
        const target = ball.classList.contains('ball') ? ball : ball.querySelector('.ball');
        if (!target) return;
        let num = target.querySelector('.ball-num');
        if (!num) {
            num = document.createElement('span');
            num.className = 'ball-num';
            target.appendChild(num);
        }
        num.textContent = String(n);
    }

    function countRoles() {
        if (leftNum > rightNum) {
            return {
                destBoxes: leftBoxes,
                srcBoxes: rightBoxes,
                larger: leftNum,
                smaller: rightNum
            };
        }
        return {
            destBoxes: rightBoxes,
            srcBoxes: leftBoxes,
            larger: rightNum,
            smaller: leftNum
        };
    }

    async function beginCountLabel() {
        if (!countMode || busy || solved || countPhase !== 'idle') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const { destBoxes, larger } = countRoles();
        const startBox = lastFilledBox(destBoxes);
        const startBall = startBox ? startBox.querySelector('.ball') : null;
        if (startBall && showBalls) {
            messageEl.innerHTML = `<strong>${larger}</strong> から かぞえよう`;
            await blinkPico([startBall]);
            if (!countMode) return;
            setBallNumber(startBall, larger);
        }
        countShown = larger;
        countPhase = 'labeled';
        busy = false;
        if (!solved) setChoicesEnabled(true);
        applyDisplayMode();
    }

    async function continueCountMoves() {
        if (!countMode || busy || solved || countPhase !== 'labeled') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const { destBoxes, srcBoxes } = countRoles();
        let n = countShown;
        while (countMode && !solved) {
            const src = lastFilledBox(srcBoxes);
            const dest = firstEmptyBox(destBoxes);
            const ball = src ? src.querySelector('.ball') : null;
            if (!ball || !dest) break;
            n += 1;
            const fly = spawnFlyingBall(ball);
            ball.remove();
            await flyBallToBox(fly, dest, null, n);
            countShown = n;
            if (!countMode || solved) break;
            if (!lastFilledBox(srcBoxes) || !firstEmptyBox(destBoxes)) break;
            await wait(1000);
        }
        countPhase = 'done';
        hintPhase = 2;
        busy = false;
        messageEl.innerHTML = promptMessage();
        if (!solved) setChoicesEnabled(true);
        applyDisplayMode();
    }

    function resetCountBoard() {
        document.querySelectorAll('.ball.flying').forEach((el) => el.remove());
        countPhase = 'idle';
        countShown = 0;
        hintPhase = 0;
        renderKastens();
        refreshEquation();
        messageEl.innerHTML = promptMessage();
    }

    function startCount() {
        if (busy) return;
        document.querySelectorAll('.ball.flying').forEach((el) => el.remove());
        drillCount = null;
        drillItems = [];
        drillFocus = null;
        drillView = 'list';
        huntTarget = null;
        huntItems = [];
        huntFocus = null;
        huntView = 'list';
        clearShiftMode();
        clearChangeMode();
        clearFourPlusMode();
        countMode = true;
        countPhase = 'idle';
        countShown = 0;
        busy = false;
        solved = false;
        hintPhase = 0;
        const picked = pickCountPair();
        leftNum = picked[0];
        rightNum = picked[1];
        lastLeft = leftNum;
        lastRight = rightNum;
        nextBtn.classList.add('hidden');
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        messageEl.innerHTML = promptMessage();
        renderKastens();
        applyDisplayMode();
    }

    function bunkaiActiveSums() {
        if (bunkaiSpecial) return [10];
        if (bunkaiSums.size > 0) return [...bunkaiSums].sort((a, b) => a - b);
        return [2, 3, 4, 5, 6, 7, 8, 9, 10];
    }

    function collectBunkaiPairs() {
        const pairs = [];
        for (const sum of bunkaiActiveSums()) {
            for (let red = 1; red < sum; red++) {
                pairs.push([red, sum - red]);
            }
        }
        if (!pairs.length) pairs.push([1, 1]);
        return pairs;
    }

    function pickBunkaiSet(n) {
        const pool = shuffleInPlace(collectBunkaiPairs());
        return pool.slice(0, Math.max(1, Math.min(n, pool.length)));
    }

    function bunkaiKnown() {
        return bunkaiPhase === 'ask-red' ? bunkaiTarget - bunkaiRed : bunkaiRed;
    }

    function bunkaiNeeded() {
        return bunkaiTarget - bunkaiKnown();
    }

    function bunkaiFillColor() {
        return bunkaiPhase === 'ask-red' ? 'red' : 'blue';
    }

    function isBunkaiScaffold() {
        return playMode === 'bunkai' && (bunkaiSpecial === 'drill4' || bunkaiSpecial === 'drill5');
    }

    function isBunkaiDrill6() {
        return playMode === 'bunkai' && bunkaiSpecial === 'drill6';
    }

    function isBunkaiDrill7() {
        return playMode === 'bunkai' && bunkaiSpecial === 'drill7';
    }

    function isBunkaiDrill8() {
        return playMode === 'bunkai' && bunkaiSpecial === 'drill8';
    }

    function isBunkaiDrill9() {
        return playMode === 'bunkai' && bunkaiSpecial === 'drill9';
    }

    function isBunkaiWatchDrill() {
        return isBunkaiDrill6() || isBunkaiDrill7();
    }

    function isBunkaiQuizDrill() {
        return isBunkaiDrill8() || isBunkaiDrill9();
    }

    function isBunkaiStoryDrill() {
        return isBunkaiWatchDrill() || isBunkaiQuizDrill();
    }

    function isBunkaiLowRedStory() {
        return isBunkaiDrill7() || isBunkaiDrill9();
    }

    function storyEqPhase() {
        return isBunkaiLowRedStory() ? 6 : 5;
    }

    function clearStoryQuizWait() {
        if (!storyQuizWait) return;
        const { resolve } = storyQuizWait;
        storyQuizWait = null;
        resolve(false);
    }

    function abortBunkaiAnim() {
        bunkaiAnimId += 1;
        if (isBunkaiStoryDrill() || bunkaiSpecial === 'drill6' || bunkaiSpecial === 'drill7' || bunkaiSpecial === 'drill8' || bunkaiSpecial === 'drill9') busy = false;
        resetDrill6Anims();
        document.querySelectorAll('.drill6-num.flying-eq').forEach((el) => el.remove());
        storyBarShown = { comp: false, botRight: false, topFive: false };
        clearStoryQuizWait();
    }

    function resetDrill6Anims() {
        [kastenLeftNum, kastenRightNum, frameSpin, tenBarsEl, equationEl].forEach((el) => {
            if (!el) return;
            el.getAnimations().forEach((anim) => anim.cancel());
            el.style.transform = '';
            el.style.opacity = '';
            el.style.visibility = '';
        });
    }

    function clearDrill6Ui() {
        drill6Phase = 0;
        storyBarShown = { comp: false, botRight: false, topFive: false };
        if (gameArea) {
            gameArea.classList.remove('drill6-eq', 'drill6-right-on', 'drill6-bars', 'drill6-ask');
        }
        if (kastenLeftNum) {
            kastenLeftNum.hidden = true;
            kastenLeftNum.textContent = '';
            kastenLeftNum.style.transform = '';
            kastenLeftNum.style.visibility = '';
            kastenLeftNum.style.opacity = '';
        }
        if (kastenRightNum) {
            kastenRightNum.hidden = true;
            kastenRightNum.textContent = '';
            kastenRightNum.style.transform = '';
            kastenRightNum.style.visibility = '';
            kastenRightNum.style.opacity = '';
        }
        if (equationEl) {
            equationEl.style.opacity = '';
            equationEl.innerHTML = '';
        }
        if (tenBarsEl) {
            tenBarsEl.innerHTML = '';
            tenBarsEl.hidden = true;
            tenBarsEl.style.width = '';
            tenBarsEl.style.opacity = '';
            tenBarsEl.getAnimations().forEach((anim) => anim.cancel());
        }
        document.querySelectorAll('.drill6-num.flying-eq').forEach((el) => el.remove());
        clearStoryQuizWait();
    }

    function drill6Extra() {
        return Math.max(0, bunkaiRed - 5);
    }

    function drill6Blue() {
        return bunkaiTarget - bunkaiRed;
    }

    function drill7ToFive() {
        return Math.max(0, 5 - bunkaiRed);
    }

    function storyPrompt() {
        const red = bunkaiRed;
        const blue = drill6Blue();
        if (drill6Phase <= 0) return '';
        if (isBunkaiLowRedStory()) {
            const rest = drill7ToFive();
            if (drill6Phase <= 2) return `<strong class="eq-red">${red}</strong> だよ`;
            if (drill6Phase === 3) {
                return `<strong class="eq-red">${red}</strong> の となり は <strong class="eq-blue">${rest}</strong>`;
            }
            if (drill6Phase === 4) return `うえ は <strong class="eq-blue">5</strong>`;
            return `<strong class="eq-red">${red}</strong> + <strong class="eq-blue">${blue}</strong> = <strong class="eq-sum">${bunkaiTarget}</strong>`;
        }
        const extra = drill6Extra();
        if (drill6Phase === 1) return `<strong class="eq-red">${red}</strong> だよ`;
        if (drill6Phase === 2) {
            if (extra > 0) {
                return `<strong class="eq-red">${red}</strong> は <strong class="eq-red">5</strong> と <strong class="eq-red">${extra}</strong>`;
            }
            return `<strong class="eq-red">5</strong> だよ`;
        }
        if (drill6Phase === 3 || drill6Phase === 4) {
            if (extra > 0) {
                return `<strong class="eq-red">${extra}</strong> の となり は <strong class="eq-blue">${blue}</strong>`;
            }
            return `<strong class="eq-blue">${blue}</strong> が いるよ`;
        }
        return `<strong class="eq-red">${red}</strong> + <strong class="eq-blue">${blue}</strong> = <strong class="eq-sum">${bunkaiTarget}</strong>`;
    }

    function storyAlive(animId) {
        return bunkaiAnimId === animId && isBunkaiStoryDrill();
    }

    async function waitIfAlive(animId, ms) {
        await wait(ms);
        return storyAlive(animId);
    }

    function cloneFlyingNum(fromEl) {
        const rect = fromEl.getBoundingClientRect();
        const cs = getComputedStyle(fromEl);
        const clone = fromEl.cloneNode(true);
        clone.id = '';
        clone.hidden = false;
        clone.classList.add('flying-eq');
        clone.style.position = 'fixed';
        clone.style.left = `${rect.left}px`;
        clone.style.top = `${rect.top}px`;
        clone.style.width = `${rect.width}px`;
        clone.style.height = `${rect.height}px`;
        clone.style.margin = '0';
        clone.style.opacity = '1';
        clone.style.visibility = 'visible';
        clone.style.transform = 'none';
        clone.style.transformOrigin = 'center center';
        clone.style.zIndex = '1000';
        clone.style.fontSize = cs.fontSize;
        clone.style.fontFamily = cs.fontFamily;
        clone.style.fontWeight = cs.fontWeight;
        clone.style.lineHeight = cs.lineHeight;
        clone.style.letterSpacing = cs.letterSpacing;
        clone.style.color = cs.color;
        document.body.appendChild(clone);
        return clone;
    }

    function flySameSize(el, targetEl, extraY = -36) {
        const from = el.getBoundingClientRect();
        const to = targetEl.getBoundingClientRect();
        const dx = to.left + (to.width - from.width) / 2 - from.left;
        const dy = to.top + (to.height - from.height) / 2 - from.top;
        return el.animate([
            { transform: 'translate(0, 0)' },
            { transform: `translate(${dx * 0.55}px, ${dy * 0.45 + extraY}px)` },
            { transform: `translate(${dx}px, ${dy}px)` }
        ], {
            duration: 520,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
        }).finished;
    }

    async function flyNumsToEquation(animId) {
        if (!storyAlive(animId)) return false;
        const flyL = kastenLeftNum && !kastenLeftNum.hidden ? cloneFlyingNum(kastenLeftNum) : null;
        const flyR = kastenRightNum && !kastenRightNum.hidden ? cloneFlyingNum(kastenRightNum) : null;
        if (kastenLeftNum) kastenLeftNum.style.visibility = 'hidden';
        if (kastenRightNum) kastenRightNum.style.visibility = 'hidden';
        drill6Phase = storyEqPhase();
        equationEl.style.opacity = '0';
        applyDisplayMode();
        await wait(50);
        if (!storyAlive(animId)) {
            flyL && flyL.remove();
            flyR && flyR.remove();
            return false;
        }
        const eqRed = equationEl.querySelector('.eq-red');
        const eqBlue = equationEl.querySelector('.eq-blue');
        try {
            await Promise.all([
                flyL && eqRed ? flySameSize(flyL, eqRed, -36) : Promise.resolve(),
                flyR && eqBlue ? flySameSize(flyR, eqBlue, -36) : Promise.resolve()
            ]);
        } catch (err) {
            flyL && flyL.remove();
            flyR && flyR.remove();
            return storyAlive(animId);
        }
        flyL && flyL.remove();
        flyR && flyR.remove();
        if (!storyAlive(animId)) return false;
        if (kastenLeftNum) {
            kastenLeftNum.hidden = true;
            kastenLeftNum.style.visibility = '';
            kastenLeftNum.style.transform = '';
        }
        if (kastenRightNum) {
            kastenRightNum.hidden = true;
            kastenRightNum.style.visibility = '';
            kastenRightNum.style.transform = '';
        }
        equationEl.style.opacity = '';
        return true;
    }

    async function showKastenFromSolo(animId) {
        const first = kastenLeftNum.getBoundingClientRect();
        drill6Phase = 1;
        applyDisplayMode();
        await wait(30);
        if (!storyAlive(animId)) return false;
        const last = kastenLeftNum.getBoundingClientRect();
        const dx = first.left - last.left + (first.width - last.width) / 2;
        const dy = first.top - last.top + (first.height - last.height) / 2;
        const scale = last.width > 0 ? first.width / last.width : 1;
        try {
            await Promise.all([
                kastenLeftNum.animate([
                    { transform: `translate(${dx}px, ${dy}px) scale(${scale})` },
                    { transform: 'translate(0, 0) scale(1)' }
                ], { duration: 520, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }).finished,
                frameSpin.animate([
                    { opacity: 0, transform: 'scale(0.92)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 450, easing: 'ease-out' }).finished
            ]);
        } catch (err) {
            return storyAlive(animId);
        }
        messageEl.innerHTML = storyPrompt();
        return true;
    }

    function storyAskPrompt() {
        const red = bunkaiRed;
        if (isBunkaiDrill9()) {
            return `<strong class="eq-red">${red}</strong> の となり は？`;
        }
        const extra = drill6Extra();
        if (extra > 0) {
            return `<strong class="eq-red">${extra}</strong> の となり は？`;
        }
        return `いくつ たす？`;
    }

    function storyQuizAnswer() {
        return isBunkaiDrill9() ? drill7ToFive() : drill6Blue();
    }

    function waitForStoryQuiz(animId) {
        if (!storyAlive(animId)) return Promise.resolve(false);
        return new Promise((resolve) => {
            storyQuizWait = { animId, resolve };
            busy = false;
            choicesEl.classList.remove('hidden');
            setChoicesEnabled(true);
            messageEl.innerHTML = storyAskPrompt();
            applyDisplayMode();
            updateHintButton();
        });
    }

    async function onStoryQuizChoose(count) {
        if (!storyQuizWait || busy || solved) return;
        if (!storyAlive(storyQuizWait.animId)) {
            clearStoryQuizWait();
            return;
        }
        busy = true;
        setChoicesEnabled(false);
        const needed = storyQuizAnswer();
        if (count === needed) {
            choicesEl.classList.add('hidden');
            const { resolve } = storyQuizWait;
            storyQuizWait = null;
            applyDisplayMode();
            resolve(true);
            return;
        }
        if (tenBarsEl) {
            tenBarsEl.classList.add('shake');
            wait(450).then(() => tenBarsEl && tenBarsEl.classList.remove('shake'));
        }
        messageEl.innerHTML = 'ちがうよ！ もういちど！';
        await wait(900);
        if (!storyQuizWait || !storyAlive(storyQuizWait.animId)) {
            busy = false;
            return;
        }
        messageEl.innerHTML = storyAskPrompt();
        setChoicesEnabled(true);
        busy = false;
    }

    async function playStoryDrillSequence(animId) {
        const red = bunkaiRed;
        const blue = drill6Blue();
        const isLow = isBunkaiLowRedStory();
        busy = true;
        solved = false;
        setChoicesEnabled(false);
        choicesEl.classList.add('hidden');
        nextBtn.classList.add('hidden');
        resetDrill6Anims();
        drill6Phase = 0;
        storyBarShown = { comp: false, botRight: false, topFive: false };
        if (kastenLeftNum) {
            kastenLeftNum.hidden = false;
            kastenLeftNum.textContent = String(red);
            kastenLeftNum.style.transform = '';
            kastenLeftNum.style.visibility = '';
        }
        if (kastenRightNum) {
            kastenRightNum.hidden = true;
            kastenRightNum.textContent = '';
            kastenRightNum.style.transform = '';
            kastenRightNum.style.visibility = '';
        }
        equationEl.style.opacity = '';
        equationEl.innerHTML = '';
        messageEl.innerHTML = '';
        applyDisplayMode();
        if (!await waitIfAlive(animId, 2000)) return;

        if (!await showKastenFromSolo(animId)) return;
        if (!await waitIfAlive(animId, 2000)) return;

        drill6Phase = 2;
        applyDisplayMode();
        messageEl.innerHTML = storyPrompt();
        if (tenBarsEl) {
            tenBarsEl.animate([
                { opacity: 0, transform: 'translateY(10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 400, easing: 'ease-out' });
        }
        if (!await waitIfAlive(animId, 2000)) return;

        if (isBunkaiQuizDrill()) {
            if (!await waitForStoryQuiz(animId)) return;
            busy = true;
            setChoicesEnabled(false);
            choicesEl.classList.add('hidden');
            applyDisplayMode();
        }

        if (isLow) {
            drill6Phase = 3;
            revealBarNum('botRight');
            messageEl.innerHTML = storyPrompt();
            if (!await waitIfAlive(animId, 2000)) return;

            drill6Phase = 4;
            revealBarNum('topFive');
            messageEl.innerHTML = storyPrompt();
            if (!await waitIfAlive(animId, 2000)) return;

            drill6Phase = 5;
        } else {
            drill6Phase = 3;
            revealBarNum('comp');
            messageEl.innerHTML = storyPrompt();
            if (!await waitIfAlive(animId, 2000)) return;

            drill6Phase = 4;
        }

        if (kastenRightNum) {
            kastenRightNum.hidden = false;
            kastenRightNum.textContent = String(blue);
            kastenRightNum.style.transform = '';
            kastenRightNum.style.visibility = '';
        }
        applyDisplayMode();
        if (kastenRightNum) {
            kastenRightNum.animate([
                { opacity: 0, transform: 'scale(0.55)' },
                { opacity: 1, transform: 'scale(1)' }
            ], { duration: 420, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
        }
        if (!await waitIfAlive(animId, 2000)) return;

        if (!await flyNumsToEquation(animId)) return;
        messageEl.innerHTML = storyPrompt();
        if (!storyAlive(animId)) return;
        solved = true;
        const reward = await grantSolveReward();
        if (!storyAlive(animId)) return;
        messageEl.innerHTML = rewardMessage(reward.wasComplete, reward.golden, reward.grew);
        nextBtn.classList.remove('hidden');
        busy = false;
        updateHintButton();
    }

    function bunkaiKastenPhase() {
        return bunkaiSpecial === 'drill5' ? 3 : 2;
    }

    function makeTenBar(units, kind, label, fixed = false) {
        const bar = document.createElement('div');
        bar.className = 'ten-bar ten-bar-' + kind;
        if (!fixed) bar.style.gridColumn = `span ${Math.max(1, units)}`;
        if (label) bar.textContent = label;
        return bar;
    }

    function makeDrill6BlueBar(blue, showNum, key) {
        const bar = makeTenBar(1, 'blue', '', true);
        const num = document.createElement('span');
        num.className = 'ten-bar-num' + (showNum ? '' : ' is-off');
        num.dataset.barKey = key;
        num.textContent = String(blue);
        bar.appendChild(num);
        return bar;
    }

    function revealBarNum(key) {
        storyBarShown[key] = true;
        const num = tenBarsEl ? tenBarsEl.querySelector(`.ten-bar-num[data-bar-key="${key}"]`) : null;
        if (!num) return;
        num.classList.remove('is-off');
        num.animate([
            { opacity: 0, transform: 'scale(0.6)' },
            { opacity: 1, transform: 'scale(1.12)' },
            { opacity: 1, transform: 'scale(1)' }
        ], { duration: 420, easing: 'ease-out' });
    }

    function renderTenBars() {
        if (!tenBarsEl) return;
        tenBarsEl.innerHTML = '';
        const red = bunkaiRed;
        const top = document.createElement('div');
        top.className = 'ten-bars-row';
        const bottom = document.createElement('div');
        bottom.className = 'ten-bars-row';
        if (bunkaiSpecial === 'drill6' || bunkaiSpecial === 'drill8') {
            const extra = Math.max(0, red - 5);
            const blue = bunkaiTarget - red;
            bottom.className = 'ten-bars-row ten-bars-full';
            if (extra === 0) {
                top.className = 'ten-bars-row ten-bars-full';
                top.appendChild(makeDrill6BlueBar(blue, storyBarShown.comp, 'comp'));
            } else {
                top.className = 'ten-bars-row ten-bars-split';
                top.appendChild(makeTenBar(1, 'red', String(extra), true));
                top.appendChild(makeDrill6BlueBar(blue, storyBarShown.comp, 'comp'));
            }
            bottom.appendChild(makeTenBar(1, 'red', '5', true));
        } else if (bunkaiSpecial === 'drill7' || bunkaiSpecial === 'drill9') {
            const rest = Math.max(0, 5 - red);
            top.className = 'ten-bars-row ten-bars-full';
            bottom.className = 'ten-bars-row ten-bars-split';
            top.appendChild(makeDrill6BlueBar(5, storyBarShown.topFive, 'topFive'));
            bottom.appendChild(makeTenBar(1, 'red', String(red), true));
            bottom.appendChild(makeDrill6BlueBar(rest, storyBarShown.botRight, 'botRight'));
        } else if (bunkaiSpecial === 'drill4') {
            const extra = Math.max(0, red - 5);
            if (extra > 0) {
                top.appendChild(makeTenBar(extra, 'red', String(extra)));
                top.appendChild(makeTenBar(5 - extra, 'empty', ''));
            } else {
                top.appendChild(makeTenBar(5, 'empty', ''));
            }
            bottom.appendChild(makeTenBar(5, 'red', '5'));
        } else {
            const filled = bunkaiHintPhase >= 2;
            top.appendChild(makeTenBar(5, filled ? 'blue' : 'empty', filled ? '5' : ''));
            bottom.appendChild(makeTenBar(red, 'red', String(red)));
            const rest = 5 - red;
            if (rest > 0) {
                bottom.appendChild(makeTenBar(rest, filled ? 'blue' : 'empty', filled ? String(rest) : ''));
            }
        }
        tenBarsEl.appendChild(top);
        tenBarsEl.appendChild(bottom);
    }

    function updateBunkaiScaffold() {
        if (isBunkaiStoryDrill()) {
            gameArea.classList.remove('scaffold-eq', 'scaffold-bars', 'scaffold-kasten');
            gameArea.classList.add('drill6-play');
            gameArea.classList.toggle('drill6-solo', drill6Phase === 0);
            gameArea.classList.toggle('drill6-eq', drill6Phase >= storyEqPhase());
            gameArea.classList.toggle('drill6-right-on', isBunkaiLowRedStory() ? drill6Phase === 5 : drill6Phase === 4);
            gameArea.classList.toggle('drill6-bars', drill6Phase >= 2);
            gameArea.classList.toggle('drill6-ask', isBunkaiQuizDrill() && !!storyQuizWait);
            if (tenBarsEl) {
                tenBarsEl.hidden = drill6Phase < 2;
                if (drill6Phase >= 2) {
                    tenBarsEl.style.opacity = '';
                    renderTenBars();
                    const w = framesContainer.getBoundingClientRect().width;
                    tenBarsEl.style.width = w > 0 ? `${Math.round(w)}px` : '';
                } else {
                    tenBarsEl.innerHTML = '';
                    tenBarsEl.style.width = '';
                }
            }
            return;
        }
        gameArea.classList.remove('drill6-play', 'drill6-solo', 'drill6-eq', 'drill6-right-on', 'drill6-bars', 'drill6-ask');
        if (tenBarsEl) tenBarsEl.style.width = '';
        const scaffold = isBunkaiScaffold();
        const kastenAt = bunkaiKastenPhase();
        const atEq = scaffold && bunkaiHintPhase === 0;
        const atBars = scaffold && bunkaiHintPhase > 0 && bunkaiHintPhase < kastenAt;
        const atKasten = scaffold && bunkaiHintPhase >= kastenAt;
        gameArea.classList.toggle('scaffold-eq', atEq);
        gameArea.classList.toggle('scaffold-bars', atBars);
        gameArea.classList.toggle('scaffold-kasten', atKasten);
        if (tenBarsEl) {
            tenBarsEl.hidden = !atBars;
            if (atBars) renderTenBars();
        }
    }

    function onBunkaiScaffoldHint() {
        if (busy || solved || !isBunkaiScaffold()) return;
        if (bunkaiHintPhase >= bunkaiKastenPhase()) return;
        bunkaiHintPhase += 1;
        if (bunkaiHintPhase >= bunkaiKastenPhase()) renderBunkaiFrames();
        messageEl.innerHTML = bunkaiPrompt();
        applyDisplayMode();
    }

    function bunkaiPrompt() {
        if (isBunkaiStoryDrill()) return storyPrompt();
        const known = bunkaiKnown();
        if (isBunkaiScaffold() && bunkaiHintPhase < bunkaiKastenPhase()) {
            return `<strong>${known}</strong> に いくつ たせば <strong>${bunkaiTarget}</strong> になるかな？`;
        }
        if (showBalls) {
            if (bunkaiPhase === 'ask-red') {
                return `あお が <strong>${known}</strong> こ あるよ。<br>あかだま は いくつ いるかな？`;
            }
            return `あか が <strong>${known}</strong> こ あるよ。<br>あお を いれて <strong>${bunkaiTarget}</strong> に しよう！`;
        }
        return `<strong>${known}</strong> に いくつ たせば <strong>${bunkaiTarget}</strong> になるかな？`;
    }

    function refreshBunkaiEquation(fillValue = null) {
        if (isBunkaiStoryDrill()) {
            if (drill6Phase >= storyEqPhase()) {
                equationEl.innerHTML =
                    `<span class="eq-red">${bunkaiRed}</span> + <span class="eq-blue">${drill6Blue()}</span> = <span class="eq-sum">${bunkaiTarget}</span>`;
            } else {
                equationEl.innerHTML = '';
            }
            return;
        }
        const known = bunkaiKnown();
        const knownClass = bunkaiPhase === 'ask-red' ? 'eq-blue' : 'eq-red';
        const fillClass = bunkaiPhase === 'ask-red' ? 'eq-red' : 'eq-blue';
        if (solved && fillValue === null) {
            equationEl.innerHTML =
                `<span class="${knownClass}">${known}</span> + <span class="${fillClass}">${bunkaiNeeded()}</span> = <span class="eq-sum">${bunkaiTarget}</span>`;
            return;
        }
        if (fillValue !== null) {
            equationEl.innerHTML =
                `<span class="${knownClass}">${known}</span> + <span class="${fillClass}">${fillValue}</span> = <span class="eq-sum">${bunkaiTarget}</span>`;
            return;
        }
        equationEl.innerHTML =
            `<span class="${knownClass}">${known}</span> + <span class="eq-blank">□</span> = <span class="eq-sum">${bunkaiTarget}</span>`;
    }

    function resetBunkaiSpin() {
        if (!frameSpin) return;
        frameSpin.getAnimations().forEach((anim) => anim.cancel());
        frameSpin.classList.remove('spinning');
        frameSpin.style.transform = '';
    }

    function emptyBunkaiBoxes() {
        return boxesInOrder.filter((box) => !box.querySelector('.ball'));
    }

    function renderBunkaiFrames() {
        framesContainer.innerHTML = '';
        boxesInOrder = [];
        const bottomCount = Math.min(5, bunkaiTarget);
        const topCount = Math.max(0, bunkaiTarget - 5);
        const bottomRow = document.createElement('div');
        bottomRow.className = 'frame-row';
        const topRow = document.createElement('div');
        topRow.className = 'frame-row';
        for (let i = 0; i < bottomCount; i++) {
            const box = makeBox();
            bottomRow.appendChild(box);
            boxesInOrder.push(box);
        }
        for (let i = 0; i < topCount; i++) {
            const box = makeBox();
            topRow.appendChild(box);
            boxesInOrder.push(box);
        }
        if (topCount > 0) framesContainer.appendChild(topRow);
        framesContainer.appendChild(bottomRow);
        const filled = bunkaiPhase === 'ask-red' ? bunkaiTarget - bunkaiRed : bunkaiRed;
        const color = bunkaiPhase === 'ask-red' ? 'blue' : 'red';
        boxesInOrder.forEach((box, i) => {
            if (i < filled) {
                const ball = document.createElement('div');
                ball.className = `ball ${color}`;
                box.appendChild(ball);
            }
        });
    }

    function bunkaiPairOpts() {
        if (bunkaiSpecial === 'drill1' || bunkaiSpecial === 'drill2' || bunkaiSpecial === 'drill4' || bunkaiSpecial === 'drill6' || bunkaiSpecial === 'drill8') {
            return [5, 6, 7, 8, 9].map((red) => `${10}-${red}`);
        }
        if (bunkaiSpecial === 'drill3' || bunkaiSpecial === 'drill5' || bunkaiSpecial === 'drill7' || bunkaiSpecial === 'drill9') {
            return [1, 2, 3, 4].map((red) => `${10}-${red}`);
        }
        const opts = [];
        for (const sum of bunkaiActiveSums()) {
            for (let red = 1; red < sum; red++) {
                opts.push(`${sum}-${red}`);
            }
        }
        return opts.length ? opts : ['2-1'];
    }

    function buildFairQueue(opts, length, avoidStart = '') {
        if (!opts.length) return Array(length).fill('2-1');
        const counts = {};
        opts.forEach((n) => { counts[n] = 0; });
        const base = Math.floor(length / opts.length);
        let extra = length % opts.length;
        shuffleInPlace(opts.slice()).forEach((n) => {
            counts[n] = base + (extra > 0 ? 1 : 0);
            if (extra > 0) extra -= 1;
        });
        const result = [];
        let last = avoidStart;
        for (let i = 0; i < length; i++) {
            const remaining = opts.filter((n) => counts[n] > 0);
            let candidates = remaining.filter((n) => n !== last);
            if (!candidates.length) candidates = remaining;
            const maxLeft = Math.max(...candidates.map((n) => counts[n]));
            candidates = candidates.filter((n) => counts[n] === maxLeft);
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            result.push(pick);
            counts[pick] -= 1;
            last = pick;
        }
        return result;
    }

    function refillBunkaiQueue() {
        const opts = bunkaiPairOpts();
        const length = harvestDone
            ? HARVEST_GOAL
            : Math.max(HARVEST_GOAL - apples.length, opts.length);
        bunkaiQueue = buildFairQueue(opts, length, `${bunkaiTarget}-${bunkaiRed}`);
    }

        const from = fly.getBoundingClientRect();

        const dy = to.top + (to.height - from.height) / 2 - from.top;
        await fly.animate([
            { transform: 'translate(0, 0) scale(1)' },
            { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) scale(1.06)` },
            { transform: `translate(${dx}px, ${dy}px) scale(1)` }
        ], {
            duration: 1000,
            easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
            fill: 'forwards'
        }).finished;

        const color = colorOverride || (fly.classList.contains('red') ? 'red' : 'blue');
        const landed = document.createElement('div');
        landed.className = `ball ${color} landed`;
        if (label != null) {
            const num = document.createElement('span');
            num.className = 'ball-num';
            num.textContent = String(label);
            landed.appendChild(num);

        box.appendChild(landed);

        if (leftNum >= rightNum) {
            return {
                destBoxes: leftBoxes,
                srcBoxes: rightBoxes,
                larger: leftNum,
                smaller: rightNum
            };
        }
        return {
            destBoxes: rightBoxes,
            srcBoxes: leftBoxes,
            larger: rightNum,
            smaller: leftNum
        };
    }

    function hintKind() {
        const sum = leftNum + rightNum;
        const larger = Math.max(leftNum, rightNum);
        if (sum <= 5) return 'to-larger';
        if (sum <= 10 && larger <= 4) return 'make5';
        if (sum <= 10) return 'to-larger';
        return 'make10';
    }

    function pickSrcBoxes(srcBoxes, count) {
        if (count <= 0) return [];
        const topRightFirst = [...filledBoxes(srcBoxes.slice(5, 10))].reverse();
        const bottomRightFirst = [...filledBoxes(srcBoxes.slice(0, 5))].reverse();
        return [...topRightFirst, ...bottomRightFirst].slice(0, count);
    }

    async function moveBallsTo(srcBoxList, destBoxList) {
        const count = Math.min(srcBoxList.length, destBoxList.length);
        const jobs = [];
        for (let i = 0; i < count; i++) {
            const ball = srcBoxList[i].querySelector('.ball');
            if (!ball) continue;
            const fly = spawnFlyingBall(ball);
            ball.remove();
            jobs.push({ fly, target: destBoxList[i], delay: i * 80 });

        await Promise.all(jobs.map(async ({ fly, target, delay }) => {
            await wait(delay);
            await flyBallToBox(fly, target);
        }));
    }

        const { destBoxes, srcBoxes } = getRoles();
        const remaining = filledBoxes(srcBoxes);
        const dest = emptyBoxes(destBoxes);
        if (!remaining.length || !dest.length) {
            hintPhase = 2;
            return;
        }
        await blinkPico(remaining.map((box) => box.querySelector('.ball')).filter(Boolean));
        await moveBallsTo(remaining, dest);
        hintPhase = 2;
    }

    async function onHint() {
        if (countMode) return;
        if (isFourPlusCircles()) {
            await onFourPlusHint();
            return;
        }
        if (playMode === 'sub') {
            await onSubHint();
            return;
        }
        if (isBunkaiScaffold()) {
            onBunkaiScaffoldHint();
            return;
        }
        if (changeMode) {
            await openChangeHint();
            return;
        }
        if (busy || solved || hintPhase >= 2) return;
        if (!showBalls && !fourPlusSpecial) return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();

        const kind = hintKind();
        if (hintPhase === 0) {
            if (kind === 'to-larger') await hintMoveAllToLarger();
            else if (kind === 'make5') await hintMake5First();
            else await hintMake10First();
        } else {
            await hintMoveRemaining();
        }

        messageEl.innerHTML = promptMessage();
        busy = false;
        if (!isHintView()) setChoicesEnabled(true);
        updateHintButton();
    }

    async function animateCombine() {
        if (!showBalls) return;
        let sourceBoxes;
        let destBoxes;
        if (hintPhase > 0) {
            const roles = getRoles();
            sourceBoxes = roles.srcBoxes;
            destBoxes = roles.destBoxes;
        } else {
            const dir = resolveMoveDir();
            sourceBoxes = dir === 'rtl' ? rightBoxes : leftBoxes;
            destBoxes = dir === 'rtl' ? leftBoxes : rightBoxes;
        }
        const sourceBalls = moveOrderBoxes(sourceBoxes)
            .map((box) => box.querySelector('.ball'))
            .filter(Boolean);
        const emptyDest = destBoxes.filter((box) => !box.querySelector('.ball'));
        const moveCount = Math.min(sourceBalls.length, emptyDest.length);

        const jobs = sourceBalls.slice(0, moveCount).map((ball, i) => {
            const fly = spawnFlyingBall(ball);
            ball.remove();
            return { fly, target: emptyDest[i], delay: i * 40 };
        });

        await Promise.all(jobs.map(async ({ fly, target, delay }) => {
            await wait(delay);
            await flyBallToBox(fly, target);
        }));
    }

    function spawnFlyingNumber(fromEl, value, color = null) {
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'num-chip' + (color === 'red' ? ' red-chip' : color === 'blue' ? ' blue-chip' : '');
        chip.textContent = String(value);
        chip.style.left = `${rect.left + (rect.width - 56) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 56) / 2}px`;
        document.body.appendChild(chip);
        return chip;
    }

    function flyFromTo(el, targetEl, extraY = -70, matchScale = false) {
        const from = el.getBoundingClientRect();
        const to = targetEl.getBoundingClientRect();
        const dx = to.left + (to.width - from.width) / 2 - from.left;
        const dy = to.top + (to.height - from.height) / 2 - from.top;
        const endScale = matchScale ? to.height / Math.max(1, from.height) : 1;
        return el.animate([
            { transform: 'translate(0, 0) scale(1)' },
            { transform: `translate(${dx * 0.55}px, ${dy * 0.45 + extraY}px) scale(${Math.max(endScale, 1) * 1.06})` },
            { transform: `translate(${dx}px, ${dy}px) scale(${endScale})` }
        ], {
            duration: 520,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
        }).finished;
    }

    async function spillElement(el, targetEl) {
        const from = el.getBoundingClientRect();
        const target = targetEl.getBoundingClientRect();
        const towardX = target.right - from.left - from.width / 2 + 12;
        const towardY = target.top - from.top;
        const fallX = towardX + 50 + Math.random() * 30;
        const fallY = window.innerHeight - from.top + 40;

        await el.animate([
            { transform: 'translate(0, 0) rotate(0deg) scale(1)' },
            { transform: `translate(${towardX}px, ${towardY - 20}px) rotate(25deg) scale(1.05)` }
        ], {
            duration: 360,
            easing: 'ease-out',
            fill: 'forwards'
        }).finished;

        await el.animate([
            { transform: `translate(${towardX}px, ${towardY - 20}px) rotate(25deg) scale(1.05)` },
            { transform: `translate(${fallX}px, ${fallY}px) rotate(420deg) scale(0.85)` }
        ], {
            duration: 760,
            easing: 'cubic-bezier(0.55, 0.09, 0.68, 0.2)',
            fill: 'forwards'
        }).finished;

        el.remove();
    }

    async function grantSolveReward() {
        const wasComplete = harvestDone;
        const prevSolves = solves;
        solves += 1;
        const golden = solves % GOLDEN_EVERY === 0;
        const canPlace = apples.length < HARVEST_GOAL;
        const canReplace = golden && apples.some((apple) => !apple.golden);
        if (canPlace || canReplace) {
            await animateFruitToTree(golden);
            collectApple(golden);
        }
        if (!wasComplete && solves >= HARVEST_GOAL) {
            completeHarvest();
        }
        let grew = '';
        if (prevSolves >= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX + STAR_MAX) {
            grew = 'star';
        } else if (prevSolves >= HARVEST_GOAL + GRASS_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            grew = 'flower';
        } else if (prevSolves >= HARVEST_GOAL && prevSolves < HARVEST_GOAL + GRASS_MAX) {
            grew = 'grass';
        }
        saveState();
        refreshOrchard(grew);
        return { wasComplete, golden, grew };
    }

    function rewardMessage(wasComplete, golden, grew) {
        if (!wasComplete && harvestDone) {
            return golden
                ? '<span style="color:#ff4081; font-size:32px;">🎉 しゅうかく かんせい！ 🎉</span><br>きんのりんご も なったよ！'
                : '<span style="color:#ff4081; font-size:32px;">🎉 きょうのしゅうかく かんせい！ 🎉</span>';
        }
        if (golden) return '<span style="color:#ff8f00; font-size:32px;">✨ きんのりんご！ ✨</span>';
        if (grew === 'grass') return '<span style="color:#43a047; font-size:32px;">🌱 くさが はえたよ！</span>';
        if (grew === 'flower') return '<span style="color:#ec407a; font-size:32px;">🌸 はなが さいたよ！</span>';
        if (grew === 'star') return '<span style="color:#5c6bc0; font-size:32px;">⭐ ほしが できたよ！</span>';
        return '<span style="color:#ff4081; font-size:32px;">🎉 大せいかい！ 🎉</span>';
    }

    async function onDrillChoose(count, button) {
        const index = drillFocus;
        const item = index != null ? drillItems[index] : null;
        if (!item || item.solved) return;
        busy = true;
        setChoicesEnabled(false);
        const answer = playMode === 'bunkai' ? item.right : playMode === 'sub' ? item.left - item.right : item.left + item.right;
        const row = drillList.querySelectorAll('.drill-item')[index];
        const blank = row ? row.querySelector('.eq-blank-btn') : null;
        let mark = row ? row.querySelector('.drill-mark') : null;
        if (row && !mark) {
            mark = document.createElement('span');
            mark.className = 'drill-mark';
            row.appendChild(mark);
        }
        const chip = spawnFlyingNumber(button, count);
        const target = blank || button;

        if (count === answer) {
            await flyFromTo(chip, target).then(() => chip.remove());
            item.solved = true;
            lastLeft = item.left;
            lastRight = item.right;
            await grantSolveReward();
            drillFocus = null;
            renderDrillList();
            choicesEl.classList.add('hidden');
            busy = false;
            applyDisplayMode();
            return;
        }

        if (mark) {
            mark.classList.add('wrong');
            mark.textContent = count > answer ? 'おおすぎるよ' : 'たりないよ';
        }
        if (count > answer) {
            await spillElement(chip, target);
        } else {
            await flyFromTo(chip, target);
            chip.remove();
        }
        if (row) row.classList.add('shake');
        await wait(1400);
        if (row) row.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        if (mark) {
            mark.classList.remove('wrong');
            mark.textContent = '';
        }
        setChoicesEnabled(true);
        busy = false;
    }

    async function onChoose(count, button) {
        if (busy) return;
        if (shiftMode) return;
        if (changeMode) {
            await onChangeChoose(count, button);
            return;
        }
        if (isHintView()) return;
        if (isDrillList()) {
            await onDrillChoose(count, button);
            return;
        }
        if (playMode === 'bunkai') {
            await onBunkaiChoose(count, button);
            return;
        }
        if (isFourPlusCircles()) {
            busy = true;
            setChoicesEnabled(false);
            updateHintButton();
            const answer = leftNum + rightNum;
            const chip = spawnFlyingNumber(button, count);
            const blank = equationEl.querySelector('.eq-blank') || equationEl;
            if (count === answer) {
                await flyFromTo(chip, blank).then(() => chip.remove());
                solved = true;
                const { wasComplete, golden, grew } = await grantSolveReward();
                refreshEquation(count);
                messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
                choicesEl.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                busy = false;
                updateHintButton();
                return;
            }
            if (count > answer) {
                messageEl.innerHTML = `わあっ！ <strong>おおすぎるよ！</strong><br>4 + ${rightNum} は ${count} より ちいさいよ`;
                await spillElement(chip, blank);
            } else {
                messageEl.innerHTML = `まだ <strong>たりないよ！</strong><br>4 + ${rightNum} は ${count} より おおきいよ`;
                await flyFromTo(chip, blank);
                chip.remove();
                refreshEquation(count);
            }
            equationEl.classList.add('shake');
            if (fourCirclesEl) fourCirclesEl.classList.add('shake');
            await wait(1400);
            equationEl.classList.remove('shake');
            if (fourCirclesEl) fourCirclesEl.classList.remove('shake');
            document.querySelectorAll('.num-chip').forEach((el) => el.remove());
            messageEl.innerHTML = promptMessage();
            refreshEquation();
            setChoicesEnabled(true);
            busy = false;
            updateHintButton();
            return;
        }
        if (playMode === 'sub') {
            busy = true;
            setChoicesEnabled(false);
            updateHintButton();
            const answer = leftNum - rightNum;
            const chip = spawnFlyingNumber(button, count);
            const blank = equationEl.querySelector('.eq-blank') || equationEl;
            if (count === answer) {
                await flyFromTo(chip, blank).then(() => chip.remove());
                solved = true;
                const { wasComplete, golden, grew } = await grantSolveReward();
                refreshEquation(count);
                messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
                choicesEl.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                busy = false;
                updateHintButton();
                return;
            }
            if (count > answer) {
                messageEl.innerHTML = `わあっ！ <strong>おおすぎるよ！</strong><br>${leftNum} − ${rightNum} は ${count} より ちいさいよ`;
                await spillElement(chip, blank);
            } else {
                messageEl.innerHTML = `まだ <strong>たりないよ！</strong><br>${leftNum} − ${rightNum} は ${count} より おおきいよ`;
                await flyFromTo(chip, blank);
                chip.remove();
                refreshEquation(count);
            }
            equationEl.classList.add('shake');
            if (hintPhase >= 1) kastensEl.classList.add('shake');
            await wait(1400);
            equationEl.classList.remove('shake');
            kastensEl.classList.remove('shake');
            document.querySelectorAll('.num-chip').forEach((el) => el.remove());
            messageEl.innerHTML = promptMessage();
            refreshEquation();
            setChoicesEnabled(true);
            busy = false;
            updateHintButton();
            return;
        }
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();

        const answer = leftNum + rightNum;
        const chip = spawnFlyingNumber(button, count);
        const blank = equationEl.querySelector('.eq-blank') || equationEl;

        if (count === answer) {
            if (countMode) {
                await flyFromTo(chip, blank).then(() => chip.remove());
                solved = true;
                hintPhase = 2;
                const { wasComplete, golden, grew } = await grantSolveReward();
                refreshEquation(count);
                messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
                choicesEl.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                busy = false;
                updateHintButton();
                return;
            }
            await Promise.all([
                flyFromTo(chip, blank).then(() => chip.remove()),
                animateCombine()
            ]);
            solved = true;
            hintPhase = 2;
            const { wasComplete, golden, grew } = await grantSolveReward();
            refreshEquation(count);
            messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);

            choicesEl.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            busy = false;
            updateHintButton();
            return;
        }

        if (count > answer) {
            await spillElement(chip, blank);
            equationEl.classList.add('shake');
            kastensEl.classList.add('shake');
        } else {
            await flyFromTo(chip, blank);
            chip.remove();
            refreshEquation(count);
            equationEl.classList.add('shake');
            kastensEl.classList.add('shake');
        }

        await wait(1400);
        equationEl.classList.remove('shake');
        kastensEl.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        messageEl.innerHTML = promptMessage();
        refreshEquation();
        setChoicesEnabled(true);
        busy = false;
        updateHintButton();
    }

    function isAppleTouchDevice() {

    function printDrill() {
        updatePrintMeta();
        document.body.classList.add('print-drill');
        document.body.offsetHeight;
        let cleaned = false;
        const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            document.body.classList.remove('print-drill');
            window.removeEventListener('afterprint', onAfterPrint);
            window.removeEventListener('focus', onReturn);
            document.removeEventListener('visibilitychange', onVis);
            document.removeEventListener('pointerdown', onInteract);
        };
        const onAfterPrint = () => {
            if (isAppleTouchDevice()) return;
            cleanup();
        };
        const onReturn = () => setTimeout(cleanup, 400);
        const onVis = () => {
            if (document.visibilityState === 'visible') setTimeout(cleanup, 400);
        };
        const onInteract = () => {
            if (Date.now() - printedAt < 1200) return;
            cleanup();
        };
        let printedAt = Date.now();
        window.addEventListener('afterprint', onAfterPrint);
        window.addEventListener('focus', onReturn);
        document.addEventListener('visibilitychange', onVis);
        document.addEventListener('pointerdown', onInteract);
        const go = () => {
            printedAt = Date.now();
            window.print();
        };
        if (isAppleTouchDevice()) {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => setTimeout(go, 80));
            });
            setTimeout(cleanup, 120000);
        } else {
            go();
        }
    }

    modeSubBtn.addEventListener('click', enterSub);
    modeBunkaiBtn.addEventListener('click', enterBunkai);
    subRandomLeftBtn.addEventListener('click', () => {
        if (!subLeftLe5 && subLefts.size === 0) return;
        subLeftLe5 = false;
        subLefts = new Set();
        pruneSubRights();
        refreshProblems();
    });
    subLe5Btn.addEventListener('click', () => {
        if (subLeftLe5) return;
        subLeftLe5 = true;
        subLefts = new Set();
        pruneSubRights();
        refreshProblems();
    });
    subRandomRightBtn.addEventListener('click', () => {
        if (subRights.size === 0) return;
        subRights = new Set();
        refreshProblems();
    });
    bunkaiRandomSumBtn.addEventListener('click', () => {
        if (bunkaiSpecial === null && bunkaiSums.size === 0) return;
        bunkaiSpecial = null;
        bunkaiSums = new Set();
        bunkaiQueue = [];
        refreshProblems();
    });
    bunkaiDrill1Btn.addEventListener('click', () => startBunkaiTokkun('drill1'));
    bunkaiDrill2Btn.addEventListener('click', () => startBunkaiTokkun('drill2'));
    bunkaiDrill3Btn.addEventListener('click', () => startBunkaiTokkun('drill3'));
    bunkaiDrill4Btn.addEventListener('click', () => startBunkaiTokkun('drill4'));
    if (bunkaiDrill5Btn) bunkaiDrill5Btn.addEventListener('click', () => startBunkaiTokkun('drill5'));
    if (bunkaiDrill6Btn) bunkaiDrill6Btn.addEventListener('click', () => startBunkaiTokkun('drill6'));
    if (bunkaiDrill7Btn) bunkaiDrill7Btn.addEventListener('click', () => startBunkaiTokkun('drill7'));
    if (bunkaiDrill8Btn) bunkaiDrill8Btn.addEventListener('click', () => startBunkaiTokkun('drill8'));
    if (bunkaiDrill9Btn) bunkaiDrill9Btn.addEventListener('click', () => startBunkaiTokkun('drill9'));
    loadState();
    refreshOrchard();
    buildFixButtons();
    buildSumButtons();
    buildEnshuButtons();
    buildHuntButtons();
    buildChoiceButtons();
    buildBunkaiSumButtons();
    buildBunkaiEnshuButtons();
    buildSubLeftButtons();
    buildSubRightButtons();
    buildSubEnshuButtons();
    showHome();
</script>

</body>
</html>
