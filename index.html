<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヌマーカステン</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
        text-align: center;
        background-color: #f0f8ff;
        color: #333;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
        min-height: 100vh;
    }
    .title-bar {
        text-align: center;
        margin: 0 auto 20px;
        max-width: 1180px;
        width: 100%;
    }
    .title-bar h1 {
        color: #ff8c00;
        font-size: 32px;
        margin: 0;
    }
    .home-back {
        display: block;
        width: 100%;
        margin-top: 10px;
        border: none;
        background: #eceff1;
        color: #455a64;
        font-family: inherit;
        font-size: 15px;
        font-weight: bold;
        padding: 8px 12px;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 3px 0 #b0bec5;
    }
    .home-back:hover {
        filter: brightness(1.03);
    }
    .home-back:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #b0bec5;
    }
    .home-panel {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 320px;
        padding: 24px 12px;
    }
    body.mode-home .home-panel {
        display: flex;
    }
    .home-lead {
        font-size: 28px;
        font-weight: bold;
        color: #546e7a;
        margin: 0 0 8px;
    }
    .home-mode-btn {
        width: min(420px, 100%);
        border: none;
        border-radius: 28px;
        padding: 22px 20px;
        font-family: inherit;
        font-size: 36px;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 0 #e65100;
        transition: transform 0.15s, filter 0.15s;
    }
    .home-mode-btn.add {
        background: linear-gradient(#ff9800, #fb8c00);
        box-shadow: 0 6px 0 #e65100;
    }
    .home-mode-btn.sub {
        background: linear-gradient(#42a5f5, #1e88e5);
        box-shadow: 0 6px 0 #1565c0;
    }
    .home-mode-btn.bunkai {
        background: linear-gradient(#66bb6a, #43a047);
        box-shadow: 0 6px 0 #2e7d32;
    }
    .home-mode-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
    }
    .home-mode-btn:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #e65100;
    }
    .home-mode-btn.sub:active {
        box-shadow: 0 3px 0 #1565c0;
    }
    .home-mode-btn.bunkai:active {
        box-shadow: 0 3px 0 #2e7d32;
    }
    body.mode-home .layout {
        grid-template-columns: 216px minmax(520px, 1fr);
    }
    body.mode-home .settings-panel,
    body.mode-home .step-panel,
    body.mode-home .home-back,
    body.mode-add .bunkai-settings,
    body.mode-add .sub-settings,
    body.mode-bunkai .add-settings,
    body.mode-bunkai .sub-settings,
    body.mode-sub .add-settings,
    body.mode-sub .bunkai-settings {
        display: none !important;
    }
    body.mode-bunkai .move-full,
    body.mode-sub .move-full {
        display: none !important;
    }
    body.mode-home .game-area .add-bar,
    body.mode-home .game-area .message,
    body.mode-home .kastens,
    body.mode-home .frame-spin,
    body.mode-home .drill6-num,
    body.mode-home .equation,
    body.mode-home .hint-row,
    body.mode-home .back-btn,
    body.mode-home .shift-panel,
    body.mode-home .change-panel,
    body.mode-home .drill-panel,
    body.mode-home .choices,
    body.mode-home .next-btn {
        display: none !important;
    }
    .layout {
        display: grid;
        grid-template-columns: 216px minmax(520px, 1fr) 180px;
        justify-content: center;
        align-items: start;
        gap: 16px;
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
    }
    .left-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
    }
    .game-area {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 28px 20px 32px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        position: relative;
        min-width: 0;
        width: 100%;
    }
    .message {
        font-size: 24px;
        font-weight: bold;
        color: #555;
        margin-bottom: 12px;
        min-height: 64px;
    }
    .message:empty {
        display: none;
        min-height: 0;
        margin: 0;
    }
    body.mode-add .game-area:not(.in-shift):not(.in-change-quiz):not(.in-change-hint):not(.in-count):not(.in-four-plus):not(.in-drill-list):not(.in-drill-hint) .message,
    body.mode-add .game-area:not(.in-shift):not(.in-change-quiz):not(.in-change-hint):not(.in-count):not(.in-four-plus):not(.in-drill-list):not(.in-drill-hint) .message:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 88px;
        margin-bottom: 8px;
        visibility: visible;
    }
    .add-bar {
        display: none;
        position: relative;
        z-index: 8;
        margin-bottom: 8px;
    }
    body.mode-add .add-bar {
        display: block;
    }
    body.mode-add .game-area.in-drill-hint .add-bar,
    body.mode-add .game-area.in-shift .add-bar,
    body.mode-add .game-area.in-change-quiz .add-bar,
    body.mode-add .game-area.in-change-hint .add-bar,
    body.mode-add .game-area.in-count .add-bar,
    body.mode-add .game-area.in-four-plus .add-bar,
    body.print-drill .add-bar {
        display: none !important;
    }
    .add-bar-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px 32px;
    }
    .add-bar-settings {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }
    .add-bar-btn {
        border: 2px solid #b0bec5;
        background: #eceff1;
        color: #37474f;
        border-radius: 16px;
        padding: 10px 16px;
        font-size: 18px;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        min-width: 148px;
    }
    .add-bar-btn:hover:not(.open) {
        background: #cfd8dc;
    }
    .add-bar-btn.open {
        background: #1565c0;
        border-color: #1565c0;
        color: #fff;
    }
    .enshu-make-btn {
        border: none;
        background: linear-gradient(#ff9800, #fb8c00);
        color: #fff;
        border-radius: 22px;
        padding: 11px 22px;
        font-size: 18px;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        min-width: 148px;
        box-shadow: 0 4px 0 #e65100;
    }
    .enshu-make-btn:hover:not(.open) {
        filter: brightness(1.05);
    }
    .enshu-make-btn.open {
        background: linear-gradient(#ef6c00, #e65100);
        box-shadow: 0 2px 0 #bf360c;
        transform: translateY(2px);
    }
    .enshu-make-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #e65100;
    }
    .add-bar-panel {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        z-index: 9;
        padding: 12px 10px 10px;
        background: #fff;
        border-radius: 14px;
        border: 1px solid #eceff1;
        box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }
    .add-bar-panel.open {
        display: block;
    }
    .add-bar-extra {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
    }
    .add-bar-sides {
        display: flex;
        justify-content: center;
        max-width: 560px;
        margin: 0 auto 12px;
        padding: 4px;
        background: #eceff1;
        border-radius: 999px;
        gap: 4px;
    }
    .side-scope {
        flex: 1;
        border: none;
        background: transparent;
        color: #607d8b;
        font-size: 14px;
        font-weight: bold;
        font-family: inherit;
        padding: 8px 8px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
    }
    .side-scope:hover:not(.active) {
        color: #37474f;
        background: rgba(255,255,255,0.55);
    }
    #fix-left-tab.active {
        background: #ffebee;
        color: #c62828;
        box-shadow: 0 1px 3px rgba(198,40,40,0.25);
    }
    #fix-right-tab.active {
        background: #e3f2fd;
        color: #1565c0;
        box-shadow: 0 1px 3px rgba(21,101,192,0.25);
    }
    #fix-either-tab.active {
        background: #e0f2f1;
        color: #00695c;
        box-shadow: 0 1px 3px rgba(0,105,92,0.25);
    }
    #fix-both-tab.active {
        background: #f3e5f5;
        color: #6a1b9a;
        box-shadow: 0 1px 3px rgba(106,27,154,0.25);
    }
    .add-bar-panel .ctrl-btn {
        width: auto;
        min-width: 96px;
        padding: 8px 14px;
        font-size: 16px;
    }
    .add-bar-panel .sum-grid,
    .add-bar-panel .fix-grid,
    .add-bar-panel .enshu-grid {
        margin: 8px auto 0;
    }
    .add-bar-panel .sum-grid {
        grid-template-columns: repeat(9, minmax(36px, 1fr));
        max-width: 520px;
    }
    .add-bar-panel .fix-grid {
        grid-template-columns: repeat(9, minmax(36px, 1fr));
        max-width: 520px;
    }
    .add-bar-panel .enshu-grid {
        grid-template-columns: repeat(10, minmax(36px, 1fr));
        max-width: 560px;
    }
    .add-settings .settings-block:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
    }
    .kastens {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 18px;
        margin: 18px auto 8px;
        flex-wrap: wrap;
    }
    .kasten-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .kasten {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }
    .kasten-row {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
    }
    .plus {
        font-size: 48px;
        font-weight: bold;
        color: #ff4081;
        line-height: 1;
        padding-bottom: 28px;
    }
    .box {
        width: 52px;
        height: 52px;
        border: 3px solid #4caf50;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #e8f5e9;
        transition: background-color 0.2s, transform 0.15s, border-color 0.2s;
    }
    .box.empty-hint {
        background-color: #fff8e1;
        border-color: #ffb300;
    }
    .box.shake,
    .equation.shake,
    .change-eq.shake,
    .kastens.shake,
    .four-circles.shake,
    .ten-bars.shake {
        animation: shake 0.45s ease-in-out;
    }
    .frame-spin {
        display: none;
        width: fit-content;
        margin: 36px auto 24px;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 2;
    }
    .game-area.in-bunkai .frame-spin {
        display: block;
    }
    .game-area.in-bunkai .kastens,
    .game-area.in-sub.sub-eq .kastens {
        display: none;
    }
    .game-area.in-sub.sub-eq .equation {
        font-size: 64px;
        min-height: 90px;
        margin: 36px 0 20px;
    }
    .game-area.in-sub .box {
        width: 60px;
        height: 60px;
    }
    .game-area.in-sub .ball:not(.flying) {
        width: 44px;
        height: 44px;
    }
    .game-area.in-bunkai .hint-row {
        display: none !important;
    }
    .game-area.in-bunkai.scaffold-eq .hint-row,
    .game-area.in-bunkai.scaffold-bars .hint-row,
    .game-area.in-bunkai.scaffold-kasten .hint-row {
        display: flex !important;
    }
    .game-area.in-bunkai.scaffold-eq .frame-spin,
    .game-area.in-bunkai.scaffold-bars .frame-spin {
        display: none !important;
    }
    .game-area.in-bunkai.scaffold-eq .equation {
        font-size: 64px;
        min-height: 90px;
        margin: 36px 0 20px;
    }
    .ten-bars {
        display: none;
        flex-direction: column;
        gap: 10px;
        width: min(420px, 100%);
        margin: 28px auto 16px;
    }
    .game-area.in-bunkai.scaffold-bars .ten-bars {
        display: flex;
    }
    .ten-bars-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        height: 72px;
    }
    .ten-bar {
        border: 4px solid #9e9e9e;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: bold;
        min-width: 0;
        background: #fff;
        color: #424242;
    }
    .ten-bar-red {
        background: #ffcdd2;
        border-color: #e57373;
        color: #c62828;
    }
    .ten-bar-blue {
        background: #bbdefb;
        border-color: #64b5f6;
        color: #1565c0;
    }
    .ten-bar-num {
        display: inline-block;
        line-height: 1;
    }
    .ten-bar-num.is-off {
        visibility: hidden !important;
        opacity: 0 !important;
    }
    .game-area.in-bunkai.drill6-play:not(.drill6-right-on) #kasten-right-num {
        display: none !important;
    }
    .ten-bar-empty {
        background: #fff;
        border-color: #bdbdbd;
    }
    .kasten-trio {
        display: contents;
    }
    .drill6-num {
        font-weight: bold;
        line-height: 1;
        letter-spacing: 0;
        min-width: 1.1em;
        text-align: center;
        pointer-events: none;
    }
    .drill6-num.flying-eq {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        font-size: clamp(52px, 10vw, 80px);
    }
    .game-area.in-bunkai.drill6-play .kasten-trio {
        display: grid;
        grid-template-columns: minmax(72px, 1fr) auto minmax(72px, 1fr);
        align-items: center;
        column-gap: 4px;
        width: 100%;
    }
    .game-area.in-bunkai.drill6-play .frame-spin {
        margin: 18px auto 8px;
    }
    .game-area.in-bunkai.drill6-play .drill6-num {
        font-size: clamp(52px, 10vw, 80px);
    }
    .game-area.in-bunkai.drill6-play #kasten-left-num {
        justify-self: end;
        padding-right: 10px;
    }
    .game-area.in-bunkai.drill6-play #kasten-right-num {
        justify-self: start;
        padding-left: 10px;
    }
    .game-area.in-bunkai.drill6-play.drill6-solo .kasten-trio {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 220px;
    }
    .game-area.in-bunkai.drill6-play.drill6-solo .frame-spin,
    .game-area.in-bunkai.drill6-play.drill6-solo #kasten-right-num,
    .game-area.in-bunkai.drill6-play.drill6-solo .ten-bars {
        display: none !important;
    }
    .game-area.in-bunkai.drill6-play.drill6-solo #kasten-left-num {
        justify-self: center;
        padding: 0;
        font-size: clamp(88px, 18vw, 132px);
    }
    .game-area.in-bunkai.drill6-play .ten-bars {
        display: none;
        margin-top: 12px;
        margin-bottom: 8px;
    }
    .game-area.in-bunkai.drill6-play.drill6-bars .ten-bars {
        display: flex;
    }
    .game-area.in-bunkai.drill6-play .ten-bars-split {
        grid-template-columns: 1fr 1fr;
    }
    .game-area.in-bunkai.drill6-play .ten-bars-full {
        grid-template-columns: 1fr;
    }
    .game-area.in-bunkai.drill6-play.drill6-eq .equation {
        font-size: clamp(52px, 10vw, 80px);
        min-height: 90px;
        margin: 18px 0 10px;
        letter-spacing: 0.08em;
        transition: none;
    }
    .game-area.in-bunkai.drill6-play:not(.drill6-eq) .equation {
        visibility: hidden;
    }
    .game-area.in-bunkai.drill6-play:not(.drill6-ask) .choices {
        display: none !important;
    }
    .game-area.in-bunkai.drill6-play.drill6-ask .equation {
        display: none;
    }
    .frame-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        width: fit-content;
        margin: 0;
        position: relative;
        z-index: 1;
        min-height: 72px;
    }
    .frame-row {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
    }
    .game-area.in-bunkai .box {
        width: 72px;
        height: 72px;
        border-width: 4px;
        border-radius: 15px;
    }
    .game-area.in-bunkai .ball:not(.flying) {
        width: 52px;
        height: 52px;
    }
    .game-area.no-grid .box.empty-hint {
        background-color: transparent;
    }
    .game-area.no-grid.no-balls.in-bunkai .frame-spin {
        margin: 0;
    }
    .game-area.no-grid.no-balls.in-bunkai .frame-container {
        min-height: 0;
        height: 0;
        margin: 0;
        overflow: hidden;
        visibility: hidden;
    }
    .ball {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    .ball-num {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        font-family: inherit;
        line-height: 1;
        text-shadow: 0 1px 2px rgba(0,0,0,0.45);
        pointer-events: none;
    }
    .ball.landed {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ball.pico {
        animation: picoBall 0.4s ease-in-out infinite;
        z-index: 2;
    }
    .box.pico {
        animation: picoBox 0.4s ease-in-out infinite;
        border-color: #ff9800 !important;
        background-color: #fff8e1 !important;
    }
    .ball.flying,
    .fruit-chip {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        will-change: transform;
        animation: none;
    }
    .num-chip {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        will-change: transform;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: #ff4081;
        color: #fff;
        font-size: 26px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(255, 64, 129, 0.35);
    }
    .num-chip.red-chip {
        background-color: #ff5252;
        box-shadow: 0 6px 12px rgba(255, 82, 82, 0.35);
    }
    .num-chip.blue-chip {
        background-color: #448aff;
        box-shadow: 0 6px 12px rgba(68, 138, 255, 0.35);
    }
    .ball.bunkai-fly {
        width: 52px;
        height: 52px;
    }
    .red { background-color: #ff5252; }
    .blue { background-color: #448aff; }

    .game-area.no-grid .box {
        border-color: transparent;
        background-color: transparent;
    }
    .game-area.no-balls .ball {
        visibility: hidden;
    }
    .game-area.no-balls .box:has(.red) {
        background-color: #ffcdd2;
        border-color: #e57373;
    }
    .game-area.no-balls .box:has(.blue) {
        background-color: #bbdefb;
        border-color: #64b5f6;
    }
    .game-area.no-grid.no-balls .box:has(.red),
    .game-area.no-grid.no-balls .box:has(.blue) {
        background-color: transparent;
        border-color: transparent;
    }
    .game-area.no-grid.no-balls .kastens,
    .game-area.no-grid.no-balls .plus {
        display: none;
    }
    .game-area.no-grid.no-balls .equation {
        font-size: 64px;
        min-height: 90px;
        margin: 36px 0 20px;
    }
    .game-area.no-grid.no-balls .hint-row {
        display: none !important;
    }
    .game-area.in-sub:not(.in-drill-list) .hint-row {
        display: flex !important;
    }
    .game-area.in-sub:not(.sub-eq):not(.in-drill-list) .kastens {
        display: flex !important;
    }
    .game-area.in-bunkai.scaffold-eq .hint-row,
    .game-area.in-bunkai.scaffold-bars .hint-row,
    .game-area.in-bunkai.scaffold-kasten .hint-row {
        display: flex !important;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px) rotate(-2deg); }

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function dateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function shiftDateKey(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        return dateKey(date);
    }

    function loadState() {
        let saved = null;
        try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (err) {
            saved = null;
        }
        const today = dateKey();
        const yesterday = shiftDateKey(-1);
        streak = Number(saved && saved.streak) || 0;
        lastHarvestDate = (saved && saved.lastHarvestDate) || '';
        if (lastHarvestDate !== today && lastHarvestDate !== yesterday) {
            streak = 0;
        }
        if (saved && saved.playDate === today) {
            apples = Array.isArray(saved.apples) ? saved.apples.slice(0, HARVEST_GOAL) : [];
            solves = Math.max(Number(saved.solves) || apples.length, apples.length);
            harvestDone = solves >= HARVEST_GOAL;
        } else {
            apples = [];
            solves = 0;
            harvestDone = false;
        }
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                playDate: dateKey(),
                apples,
                solves,
                harvestDone,
                streak,
                lastHarvestDate
            }));
        } catch (err) {
            /* ignore quota / private mode */
        }
    }

    function grassCount() {
        return Math.min(GRASS_MAX, Math.max(0, solves - HARVEST_GOAL));
    }

    function flowerCount() {
        return Math.min(FLOWER_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX));
    }

    function starCount() {
        return Math.min(STAR_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX - FLOWER_MAX));
    }

    function renderTree() {
        canopy.querySelectorAll('.tree-apple').forEach((el) => el.remove());
        apples.slice(0, HARVEST_GOAL).forEach((apple, i) => {
            const spot = APPLE_SPOTS[i];
            const el = document.createElement('div');
            el.className = 'tree-apple' + (apple.golden ? ' golden' : '');
            el.style.left = `${spot.x}%`;
            el.style.top = `${spot.y}%`;
            canopy.appendChild(el);
        });
    }

    function renderMeadow() {
        meadow.innerHTML = '';
        const grasses = grassCount();
        const flowers = flowerCount();
        for (let i = 0; i < grasses; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'grass';
            wrap.style.left = `${GRASS_SPOTS[i].x}%`;
            wrap.style.height = `${GRASS_SPOTS[i].h}px`;
            const blade = document.createElement('div');
            blade.className = 'grass-blade';
            wrap.appendChild(blade);
            if (i < flowers) {
                const bloom = document.createElement('div');
                bloom.className = `bloom hue-${i % 3}`;
                wrap.appendChild(bloom);
            }
            meadow.appendChild(wrap);
        }
    }

    function renderStars() {
        starField.innerHTML = '';
        const n = starCount();
        treeSky.classList.toggle('starry', n > 0 && n < 8);
        treeSky.classList.toggle('starry-deep', n >= 8);
        for (let i = 0; i < n; i++) {
            const star = document.createElement('div');
            star.className = 'sky-star';
            star.style.left = `${STAR_SPOTS[i].x}%`;
            star.style.top = `${STAR_SPOTS[i].y}%`;
            star.style.animationDelay = `${(i % 7) * 0.18}s`;
            starField.appendChild(star);
        }
    }

    function popLast(selector) {
        const els = treeSky.querySelectorAll(selector);
        const last = els[els.length - 1];
        if (!last) return;
        last.classList.remove('just-grew');
        void last.offsetWidth;
        last.classList.add('just-grew');
    }

    function renderHarvestMeter() {
        harvestMeter.classList.toggle('done', harvestDone);
        if (solves <= HARVEST_GOAL) {
            harvestMeter.innerHTML = `きょうのりんご <strong>${Math.min(apples.length, HARVEST_GOAL)}</strong> / ${HARVEST_GOAL}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX) {
            harvestMeter.innerHTML = `きょうのくさ <strong>${grassCount()}</strong> / ${GRASS_MAX}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            harvestMeter.innerHTML = `きょうのはな <strong>${flowerCount()}</strong> / ${FLOWER_MAX}`;
        } else {
            harvestMeter.innerHTML = `きょうのほし <strong>${starCount()}</strong>`;
        }
        streakCaption.innerHTML = `れんぞく <strong>${streak}</strong> 日`;
    }

    function refreshOrchard(grew) {
        renderTree();
        renderMeadow();
        renderStars();
        renderHarvestMeter();
        if (grew === 'grass') popLast('.grass');
        if (grew === 'flower') popLast('.bloom');
        if (grew === 'star') popLast('.sky-star');
    }

    function nextAppleSlot() {
        let index = apples.length;
        if (index >= HARVEST_GOAL) {
            const plain = apples.findIndex((apple) => !apple.golden);
            index = plain >= 0 ? plain : HARVEST_GOAL - 1;
        }
        let slot = canopy.querySelectorAll('.tree-apple')[index];
        if (!slot) {
            const spot = APPLE_SPOTS[index] || APPLE_SPOTS[0];
            slot = document.createElement('div');
            slot.className = 'tree-apple';
            slot.style.left = `${spot.x}%`;
            slot.style.top = `${spot.y}%`;
            slot.style.visibility = 'hidden';
            canopy.appendChild(slot);
        }
        return slot;
    }

    function fruitStartEl() {
        if (playMode === 'bunkai') {
            const color = bunkaiPhase === 'ask-red' ? '.red' : '.blue';
            const balls = framesContainer.querySelectorAll(`.ball${color}`);
            if (showBalls && balls.length) return balls[balls.length - 1];
            return equationEl.querySelector(bunkaiPhase === 'ask-red' ? '.eq-red' : '.eq-blue') || equationEl;
        }
        if (isFourPlusCircles()) {
            const dots = fourCirclesEl ? fourCirclesEl.querySelectorAll('.four-dot') : [];
            if (dots.length) return dots[dots.length - 1];
            return equationEl.querySelector('.eq-sum') || equationEl;
        }
        if (changeMode && changeView === 'quiz') {
            return changeEqTo.querySelector('.eq-sum') || changeEqTo;
        }
        const balls = kastensEl.querySelectorAll('.ball');
        if (showBalls && balls.length) return balls[balls.length - 1];
        return equationEl.querySelector('.eq-sum') || equationEl;
    }

    async function animateFruitToTree(golden) {
        const fromEl = fruitStartEl();
        const slot = nextAppleSlot();
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'fruit-chip' + (golden ? ' golden' : '');
        chip.style.left = `${rect.left + (rect.width - 36) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 36) / 2}px`;
        document.body.appendChild(chip);
        await flyFromTo(chip, slot);
        chip.remove();
        slot.remove();
    }

    function collectApple(golden) {
        if (apples.length < HARVEST_GOAL) {
            apples.push({ golden });
            return;
        }
        if (golden) {
            const plain = apples.findIndex((apple) => !apple.golden);
            if (plain >= 0) apples[plain].golden = true;
        }
    }

    function completeHarvest() {
        const today = dateKey();
        const yesterday = shiftDateKey(-1);
        harvestDone = true;
        if (lastHarvestDate !== today) {
            streak = lastHarvestDate === yesterday ? streak + 1 : 1;

    function pairFitsSum(l, r) {
        const s = l + r;
        if (selectedSums.size > 0) return selectedSums.has(s);
        if (sumMode === 'le10') return s <= 10;
        if (sumMode === 'le5') return s <= 5;
        return true;
    }

    function sideConstraintDigits() {
        if (sideMode === 'le4') return [1, 2, 3, 4];
        if (sideMode === 'ge5') return [5, 6, 7, 8, 9];
        if (selectedSides.size > 0) return [...selectedSides];
        return null;
    }

    function pairFitsSide(l, r) {
        const digits = sideConstraintDigits();
        if (!digits) return true;
        if (fixTarget === 'left') return digits.includes(l);
        if (fixTarget === 'right') return digits.includes(r);
        if (fixTarget === 'both') return digits.includes(l) && digits.includes(r);
        return digits.includes(l) || digits.includes(r);
    }

    function choosePair(pairs) {
        let choices = pairs;
        if (lastLeft !== null && pairs.length > 1) {
            const filtered = pairs.filter(([l, r]) => l !== lastLeft || r !== lastRight);
            if (filtered.length) choices = filtered;
        }
        const picked = choices[randInt(0, choices.length - 1)];
        lastLeft = picked[0];
        lastRight = picked[1];
        return picked;
    }

    function uniquePairs(pairs) {
        const seen = new Set();
        const unique = [];
        for (const [l, r] of pairs) {
            if (l < 1 || r < 1 || l > 9 || r > 9) continue;
            const key = `${l}+${r}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push([l, r]);
        }
        return unique;
    }

    function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function collectPairs() {
        const MIN = 1;
        const MAX = 9;
        const pairs = [];

        function pushMatching(pred) {
            for (let l = MIN; l <= MAX; l++) {
                for (let r = MIN; r <= MAX; r++) {
                    if (pred(l, r)) pairs.push([l, r]);
                }
            }
        }

        pushMatching((l, r) => pairFitsSum(l, r) && pairFitsSide(l, r));

        if (pairs.length === 0 && sideConstraintDigits()) {
            pushMatching((l, r) => pairFitsSide(l, r));
        }

        if (pairs.length === 0 && (selectedSums.size > 0 || sumMode === 'le10' || sumMode === 'le5')) {
            pushMatching((l, r) => pairFitsSum(l, r));
        }

        if (pairs.length === 0 && selectedSums.size > 0) {
            for (const sum of selectedSums) {
                for (let l = MIN; l <= MAX; l++) {
                    const r = sum - l;
                    if (r >= MIN && r <= MAX) pairs.push([l, r]);
                }
            }
        }

        if (pairs.length === 0) {
            pairs.push([randDigit(), randDigit()]);
        }
        return uniquePairs(pairs);
    }

    function pickSetAllowingDup(n, uniquePool) {
        const pool = uniquePool.slice();
        if (!pool.length) return [[randDigit(), randDigit()]];
        if (n <= pool.length) return shuffleInPlace(pool).slice(0, Math.max(1, n));
        const result = [];
        let prev = null;
        while (result.length < n) {
            const round = shuffleInPlace(pool.slice());
            if (prev && round.length > 1) {
                const idx = round.findIndex(([l, r]) => l !== prev[0] || r !== prev[1]);
                if (idx > 0) {
                    const [item] = round.splice(idx, 1);
                    round.unshift(item);
                }
            }
            for (const pair of round) {
                if (result.length >= n) break;
                result.push(pair);
                prev = pair;
            }
        }
        return result;
    }

    function pickUniqueSet(n) {
        const pool = shuffleInPlace(collectPairs());
        if (enshuAllowDup) return pickSetAllowingDup(n, pool);
        return pool.slice(0, Math.max(1, Math.min(n, pool.length)));
    }

    function allAddendPairs() {
        const MIN = 1;
        const MAX = 9;
        const pairs = [];
        for (let l = MIN; l <= MAX; l++) {
            for (let r = MIN; r <= MAX; r++) {
                if (pairFitsSide(l, r)) pairs.push([l, r]);
            }
        }
        const unique = uniquePairs(pairs);
        if (unique.length) return unique;
        const fallback = [];
        for (let l = MIN; l <= MAX; l++) {
            for (let r = MIN; r <= MAX; r++) {
                fallback.push([l, r]);
            }
        }
        return uniquePairs(fallback);
    }

    function uniqueSubPairs(pairs) {
        const seen = new Set();
        const unique = [];
        for (const [l, r] of pairs) {
            if (l < 1 || r < 1 || l > 10 || r > 9 || l <= r) continue;
            const key = `${l}-${r}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push([l, r]);
        }
        return unique;
    }

    function maxSubLeft() {
        if (subLeftLe5) return 5;
        if (subLefts.size) return Math.max(...subLefts);
        return 10;
    }

    function pruneSubRights() {
        const maxL = maxSubLeft();
        for (const r of [...subRights]) {
            if (r >= maxL) subRights.delete(r);
        }
    }

    function subLeftPool() {
        if (subLeftLe5) return [1, 2, 3, 4, 5];
        if (subLefts.size) return [...subLefts];
        return Array.from({ length: 10 }, (_, i) => i + 1);
    }

    function subRightPool() {
        const maxL = maxSubLeft();
        if (subRights.size) return [...subRights].filter((r) => r < maxL);
        return Array.from({ length: 9 }, (_, i) => i + 1).filter((r) => r < maxL);
    }

    function collectSubPairs() {
        const lefts = subLeftPool();
        const rights = subRightPool();
        const pairs = [];
        for (const l of lefts) {
            for (const r of rights) {
                if (l > r) pairs.push([l, r]);
            }
        }
        let unique = uniqueSubPairs(pairs);
        if (unique.length) return unique;
        for (const l of lefts) {
            for (let r = 1; r < l && r <= 9; r++) pairs.push([l, r]);
        }
        unique = uniqueSubPairs(pairs);
        if (unique.length) return unique;
        return [[7, 2]];
    }

    function pickSubAddends() {
        return choosePair(collectSubPairs());
    }

    function pickSubSet(n) {
        const pool = shuffleInPlace(collectSubPairs());
        return pool.slice(0, Math.max(1, Math.min(n, pool.length)));
    }

    function pickHuntSet(target, n = 20) {
        const bands = new Map();
        for (const [l, r] of allAddendPairs()) {
            const dist = Math.abs(l + r - target);
            if (!bands.has(dist)) bands.set(dist, []);
            bands.get(dist).push([l, r]);
        }
        const picked = [];
        const distances = [...bands.keys()].sort((a, b) => a - b);
        for (const dist of distances) {
            if (picked.length >= n) break;
            const band = shuffleInPlace(bands.get(dist));
            picked.push(...band);
        }
        return shuffleInPlace(picked.slice(0, Math.max(1, Math.min(n, picked.length))));
    }

    function pickAddends() {
        return choosePair(collectPairs());
    }

    function clearShiftMode() {

    function shiftPrompt() {

    function pickShiftGoal(startL, startR) {
        const sum = startL + startR;
        const options = [];
        for (let l = 0; l <= 10; l++) {
            const r = sum - l;
            if (r < 0 || r > 10) continue;
            if (l === startL) continue;
            options.push(l);
        }
        const preferred = options.filter((l) => {
            const r = sum - l;
            return l >= 1 && l <= 9 && r >= 1 && r <= 9;
        });
        const nearby = preferred.filter((l) => Math.abs(l - startL) <= 2);
        const pool = nearby.length ? nearby : (preferred.length ? preferred : options);
        if (!pool.length) return null;
        return pool[randInt(0, pool.length - 1)];
    }

    function pickShiftStart() {
        const pairs = shuffleInPlace(collectPairs().slice());
        for (const [l, r] of pairs) {
            const goal = pickShiftGoal(l, r);
            if (goal != null) return [l, r, goal];
        }
        return [3, 5, 2];
    }

    function updateShiftButtons() {
        if (!shiftToRightBtn) return;
        const canRight = !busy && !solved && leftNum > 0 && rightNum < 10;
        const canLeft = !busy && !solved && rightNum > 0 && leftNum < 10;

    function lastFilledBox(boxes) {
        for (let i = boxes.length - 1; i >= 0; i--) {
            if (hasBall(boxes[i])) return boxes[i];

    }

    function firstEmptyBox(boxes) {
        return boxes.find((box) => !hasBall(box)) || null;

    async function shiftOne(toRight) {
        if (!shiftMode || busy || solved) return;
        const srcBoxes = toRight ? leftBoxes : rightBoxes;
        const destBoxes = toRight ? rightBoxes : leftBoxes;
        if (toRight) {
            if (leftNum <= 0 || rightNum >= 10) return;
        } else if (rightNum <= 0 || leftNum >= 10) {
            return;
        }

        busy = true;
        updateShiftButtons();
        updateHintButton();

        if (showBalls) {
            const src = lastFilledBox(srcBoxes);
            const dest = firstEmptyBox(destBoxes);
            if (src && dest) {
                const ball = src.querySelector('.ball');
                const fly = spawnFlyingBall(ball);
                ball.remove();
                await flyBallToBox(fly, dest, toRight ? 'blue' : 'red');
            }
        }

        if (toRight) {
            leftNum -= 1;
            rightNum += 1;
        } else {
            leftNum += 1;
            rightNum -= 1;
        }
        if (!showBalls) renderKastens();
        refreshEquation();
        busy = false;
        messageEl.innerHTML = shiftPrompt();
        applyDisplayMode();
    }

        if (!shiftMode || busy || solved) return;

    function clearChangeMode() {
        changeMode = false;
        changeOpSelected = null;
        changeOp = null;
        changeView = 'quiz';
    }

    function changeOpLabel(op) {
        if (op === 'left+1') return 'ひだりを 1 ふやす';
        if (op === 'left-1') return 'ひだりを 1 へらす';
        if (op === 'right+1') return 'みぎを 1 ふやす';
        if (op === 'right-1') return 'みぎを 1 へらす';
        return 'ひとつへんか';
    }

    function applyChangeOp(op, l, r) {
        let newL = l;
        let newR = r;
        let blank = 'right';
        let answer = r;
        if (op === 'left+1') {
            newL = l + 1;
            newR = r - 1;
            blank = 'right';
            answer = newR;
        } else if (op === 'left-1') {
            newL = l - 1;
            newR = r + 1;
            blank = 'right';
            answer = newR;
        } else if (op === 'right+1') {
            newL = l - 1;
            newR = r + 1;
            blank = 'left';
            answer = newL;
        } else if (op === 'right-1') {
            newL = l + 1;
            newR = r - 1;
            blank = 'left';
            answer = newL;
        } else {
            return null;
        }
        if (newL < 1 || newL > 9 || newR < 1 || newR > 9) return null;
        return { newL, newR, blank, answer };
    }

    function validOpsForPair(l, r) {
        return ['left+1', 'left-1', 'right+1', 'right-1'].filter((op) => applyChangeOp(op, l, r));
    }

    function pickChangeProblem(selected) {
        const pairs = shuffleInPlace(collectPairs().slice());
        const ops = selected === 'random'
            ? ['left+1', 'left-1', 'right+1', 'right-1']
            : [selected];
        const candidates = [];
        for (const [l, r] of pairs) {
            for (const op of ops) {
                const spec = applyChangeOp(op, l, r);
                if (!spec) continue;
                if (lastLeft === l && lastRight === r && changeOp === op) continue;
                candidates.push({ l, r, op, spec });
            }
        }
        if (!candidates.length) {
            for (const [l, r] of pairs) {
                for (const op of ops) {
                    const spec = applyChangeOp(op, l, r);
                    if (spec) candidates.push({ l, r, op, spec });
                }
            }
        }
        if (!candidates.length) return null;
        return candidates[randInt(0, candidates.length - 1)];
    }

    function coloredEq(l, r, sum, blankSide, filled) {
        const leftPart = blankSide === 'left' && !filled
            ? `<span class="eq-blank">□</span>`
            : `<span class="eq-red">${l}</span>`;
        const rightPart = blankSide === 'right' && !filled
            ? `<span class="eq-blank">□</span>`
            : `<span class="eq-blue">${r}</span>`;
        return `${leftPart} + ${rightPart} = <span class="eq-sum">${sum}</span>`;
    }

        clearCountMode();
        clearFourPlusMode();

        drillItems = [];
        drillFocus = null;
        drillView = 'list';
        huntTarget = null;
        huntItems = [];

            changeOpSelected = selected;

    function changeMovesToRight() {
        return changeOp === 'left-1' || changeOp === 'right+1';

    async function playChangeHintAnim() {
        leftNum = changeStartL;
        rightNum = changeStartR;
        messageEl.innerHTML = changeOpLabel(changeOp);
        renderKastens();
        refreshEquation();
        if (!showBalls) {
            leftNum = changeNewL;
            rightNum = changeNewR;
            refreshEquation();
            hintPhase = 2;
            return;
        }
        const toRight = changeMovesToRight();
        const srcBoxes = toRight ? leftBoxes : rightBoxes;
        const destBoxes = toRight ? rightBoxes : leftBoxes;
        const src = lastFilledBox(srcBoxes);
        const dest = firstEmptyBox(destBoxes);
        const ball = src ? src.querySelector('.ball') : null;
        if (!ball || !dest) {
            leftNum = changeNewL;
            rightNum = changeNewR;
            refreshEquation();
            hintPhase = 2;
            return;
        }
        await blinkPico([ball]);
        const fly = spawnFlyingBall(ball);
        ball.remove();
        await flyBallToBox(fly, dest, toRight ? 'blue' : 'red');
        leftNum = changeNewL;
        rightNum = changeNewR;
        refreshEquation();
        hintPhase = 2;
    }

    async function openChangeHint() {
        if (!changeMode || busy || solved || !showBalls) return;
        changeView = 'hint';
        hintPhase = 0;
        choicesEl.classList.add('hidden');
        busy = true;
        applyDisplayMode();
        await playChangeHintAnim();
        busy = false;
        applyDisplayMode();

    async function replayChangeHint() {
        if (!changeMode || changeView !== 'hint' || busy || solved) return;
        hintPhase = 0;
        busy = true;
        applyDisplayMode();
        await playChangeHintAnim();
        busy = false;
        applyDisplayMode();

    function backToChangeQuiz() {
        hintPhase = 0;
        leftNum = changeStartL;
        rightNum = changeStartR;
        changeView = 'quiz';
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());

    async function onChangeChoose(count, button) {
        if (solved || changeView !== 'quiz') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const blank = changeEqTo.querySelector('.eq-blank') || changeEqTo;
        const chip = spawnFlyingNumber(button, count);
        if (count === changeAnswer) {
            await flyFromTo(chip, blank).then(() => chip.remove());
            solved = true;
            renderChangeQuiz();
            const { wasComplete, golden, grew } = await grantSolveReward();
            messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
            choicesEl.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            busy = false;
            applyDisplayMode();
            return;
