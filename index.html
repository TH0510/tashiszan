    function clearShiftMode() {
        shiftMode = false;
        shiftGoalLeft = null;
    }

    function shiftPrompt() {
        return `ひだりを <strong class="eq-red">${shiftGoalLeft}</strong> にしてね`;
    }

    function pickShiftGoal(startL, startR) {
        const sum = startL + startR;
        const options = [];
        for (let l = 0; l <= 10; l++) {
            const r = sum - l;
            if (r < 0 || r > 10) continue;
            if (l === startL) continue;
            options.push(l);
        }
        const preferred = options.filter((l) => {
            const r = sum - l;
            return l >= 1 && l <= 9 && r >= 1 && r <= 9;
        });
        const nearby = preferred.filter((l) => Math.abs(l - startL) <= 2);
        const pool = nearby.length ? nearby : (preferred.length ? preferred : options);
        if (!pool.length) return null;
        return pool[randInt(0, pool.length - 1)];
    }

    function pickShiftStart() {
        const pairs = shuffleInPlace(collectPairs().slice());
        for (const [l, r] of pairs) {
            const goal = pickShiftGoal(l, r);
            if (goal != null) return [l, r, goal];
        }
        return [3, 5, 2];
    }

    function updateShiftButtons() {
        if (!shiftToRightBtn) return;
        const canRight = !busy && !solved && leftNum > 0 && rightNum < 10;
        const canLeft = !busy && !solved && rightNum > 0 && leftNum < 10;
        shiftToRightBtn.disabled = !canRight;
        shiftToLeftBtn.disabled = !canLeft;
        shiftDoneBtn.disabled = busy || solved;
    }

    function startShift() {
        clearChangeMode();
        clearCountMode();
        drillCount = null;
        drillItems = [];
        drillFocus = null;
        drillView = 'list';
        huntTarget = null;
        huntItems = [];
        huntFocus = null;
        huntView = 'list';
        shiftMode = true;
        busy = false;
        solved = false;
        hintPhase = 0;
        const picked = pickShiftStart();
        leftNum = picked[0];
        rightNum = picked[1];
        shiftGoalLeft = picked[2];
        lastLeft = leftNum;
        lastRight = rightNum;
        nextBtn.classList.add('hidden');
        choicesEl.classList.add('hidden');
        messageEl.innerHTML = shiftPrompt();
        renderKastens();
        applyDisplayMode();
    }

    function lastFilledBox(boxes) {
        for (let i = boxes.length - 1; i >= 0; i--) {
            if (hasBall(boxes[i])) return boxes[i];
        }
        return null;
    }

    function firstEmptyBox(boxes) {
        return boxes.find((box) => !hasBall(box)) || null;
    }

    async function shiftOne(toRight) {
        if (!shiftMode || busy || solved) return;
        const srcBoxes = toRight ? leftBoxes : rightBoxes;
        const destBoxes = toRight ? rightBoxes : leftBoxes;
        if (toRight) {
            if (leftNum <= 0 || rightNum >= 10) return;
        } else if (rightNum <= 0 || leftNum >= 10) {
            return;
        }

        busy = true;
        updateShiftButtons();
        updateHintButton();

        if (showBalls) {
            const src = lastFilledBox(srcBoxes);
            const dest = firstEmptyBox(destBoxes);
            if (src && dest) {
                const ball = src.querySelector('.ball');
                const fly = spawnFlyingBall(ball);
                ball.remove();
                await flyBallToBox(fly, dest, toRight ? 'blue' : 'red');
            }
        }

        if (toRight) {
            leftNum -= 1;
            rightNum += 1;
        } else {
            leftNum += 1;
            rightNum -= 1;
        }
        if (!showBalls) renderKastens();
        refreshEquation();
        busy = false;
        messageEl.innerHTML = shiftPrompt();
        applyDisplayMode();
    }

    async function completeShift() {
        if (!shiftMode || busy || solved) return;
        if (leftNum !== shiftGoalLeft) {
            busy = true;
            updateShiftButtons();
            messageEl.innerHTML = `まだ <strong>ちがうよ</strong><br>${shiftPrompt()}`;
            equationEl.classList.add('shake');
            kastensEl.classList.add('shake');
            await wait(900);
            equationEl.classList.remove('shake');
            kastensEl.classList.remove('shake');
            messageEl.innerHTML = shiftPrompt();
            busy = false;
            applyDisplayMode();
            return;
        }
        busy = true;
        updateShiftButtons();
        solved = true;
        const { wasComplete, golden, grew } = await grantSolveReward();
        messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
        nextBtn.classList.remove('hidden');
        busy = false;
        applyDisplayMode();
    }

    function clearChangeMode() {
        changeMode = false;
        changeOpSelected = null;
        changeOp = null;
        changeView = 'quiz';
    }

    function changeOpLabel(op) {
        if (op === 'left+1') return 'ひだりを 1 ふやす';
        if (op === 'left-1') return 'ひだりを 1 へらす';
        if (op === 'right+1') return 'みぎを 1 ふやす';
        if (op === 'right-1') return 'みぎを 1 へらす';
        return 'ひとつへんか';
    }

    function applyChangeOp(op, l, r) {
        let newL = l;
        let newR = r;
        let blank = 'right';
        let answer = r;
        if (op === 'left+1') {
            newL = l + 1;
            newR = r - 1;
            blank = 'right';
            answer = newR;
        } else if (op === 'left-1') {
            newL = l - 1;
            newR = r + 1;
            blank = 'right';
            answer = newR;
        } else if (op === 'right+1') {
            newL = l - 1;
            newR = r + 1;
            blank = 'left';
            answer = newL;
        } else if (op === 'right-1') {
            newL = l + 1;
            newR = r - 1;
            blank = 'left';
            answer = newL;
        } else {
            return null;
        }
        if (newL < 1 || newL > 9 || newR < 1 || newR > 9) return null;
        return { newL, newR, blank, answer };
    }

    function validOpsForPair(l, r) {
        return ['left+1', 'left-1', 'right+1', 'right-1'].filter((op) => applyChangeOp(op, l, r));
    }

    function pickChangeProblem(selected) {
        const pairs = shuffleInPlace(collectPairs().slice());
        const ops = selected === 'random'
            ? ['left+1', 'left-1', 'right+1', 'right-1']
            : [selected];
        const candidates = [];
        for (const [l, r] of pairs) {
            for (const op of ops) {
                const spec = applyChangeOp(op, l, r);
                if (!spec) continue;
                if (lastLeft === l && lastRight === r && changeOp === op) continue;
                candidates.push({ l, r, op, spec });
            }
        }
        if (!candidates.length) {
            for (const [l, r] of pairs) {
                for (const op of ops) {
                    const spec = applyChangeOp(op, l, r);
                    if (spec) candidates.push({ l, r, op, spec });
                }
            }
        }
        if (!candidates.length) return null;
        return candidates[randInt(0, candidates.length - 1)];
    }

    function coloredEq(l, r, sum, blankSide, filled) {
        const leftPart = blankSide === 'left' && !filled
            ? `<span class="eq-blank">□</span>`
            : `<span class="eq-red">${l}</span>`;
        const rightPart = blankSide === 'right' && !filled
            ? `<span class="eq-blank">□</span>`
            : `<span class="eq-blue">${r}</span>`;
        return `${leftPart} + ${rightPart} = <span class="eq-sum">${sum}</span>`;
    }

    function renderChangeQuiz() {
        const sum = changeStartL + changeStartR;
        changeTitle.textContent = 'ひとつへんか';
        changeCaption.textContent = changeOpLabel(changeOp);
        changeEqFrom.innerHTML = coloredEq(changeStartL, changeStartR, sum, null, true);
        changeEqTo.innerHTML = coloredEq(changeNewL, changeNewR, sum, changeBlank, solved);
    }

    function startChange(selected) {
        clearShiftMode();
        clearCountMode();
        drillCount = null;
        drillItems = [];
        drillFocus = null;
        drillView = 'list';
        huntTarget = null;
        huntItems = [];
        huntFocus = null;
        huntView = 'list';
        const picked = pickChangeProblem(selected);
        if (!picked) {
            changeMode = true;
            changeOpSelected = selected;
            changeView = 'quiz';
            solved = false;
            busy = false;
            hintPhase = 0;
            nextBtn.classList.add('hidden');
            choicesEl.classList.add('hidden');
            changeTitle.textContent = 'ひとつへんか';
            changeCaption.textContent = '';
            changeEqFrom.textContent = '';
            changeEqTo.textContent = 'この せってい では できないよ';
            applyDisplayMode();
            return;
        }
        changeMode = true;
        changeOpSelected = selected;
        changeOp = picked.op;
        changeView = 'quiz';
        changeStartL = picked.l;
        changeStartR = picked.r;
        changeNewL = picked.spec.newL;
        changeNewR = picked.spec.newR;
        changeBlank = picked.spec.blank;
        changeAnswer = picked.spec.answer;
        leftNum = changeStartL;
        rightNum = changeStartR;
        lastLeft = changeStartL;
        lastRight = changeStartR;
        busy = false;
        solved = false;
        hintPhase = 0;
        nextBtn.classList.add('hidden');
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        renderChangeQuiz();
        applyDisplayMode();
    }

    function changeMovesToRight() {
        return changeOp === 'left-1' || changeOp === 'right+1';
    }

    async function playChangeHintAnim() {
        leftNum = changeStartL;
        rightNum = changeStartR;
        messageEl.innerHTML = changeOpLabel(changeOp);
        renderKastens();
        refreshEquation();
        if (!showBalls) {
            leftNum = changeNewL;
            rightNum = changeNewR;
            refreshEquation();
            hintPhase = 2;
            return;
        }
        const toRight = changeMovesToRight();
        const srcBoxes = toRight ? leftBoxes : rightBoxes;
        const destBoxes = toRight ? rightBoxes : leftBoxes;
        const src = lastFilledBox(srcBoxes);
        const dest = firstEmptyBox(destBoxes);
        const ball = src ? src.querySelector('.ball') : null;
        if (!ball || !dest) {
            leftNum = changeNewL;
            rightNum = changeNewR;
            refreshEquation();
            hintPhase = 2;
            return;
        }
        await blinkPico([ball]);
        const fly = spawnFlyingBall(ball);
        ball.remove();
        await flyBallToBox(fly, dest, toRight ? 'blue' : 'red');
        leftNum = changeNewL;
        rightNum = changeNewR;
        refreshEquation();
        hintPhase = 2;
    }

    async function openChangeHint() {
        if (!changeMode || busy || solved || !showBalls) return;
        changeView = 'hint';
        hintPhase = 0;
        choicesEl.classList.add('hidden');
        busy = true;
        applyDisplayMode();
        await playChangeHintAnim();
        busy = false;
        applyDisplayMode();
    }

    async function replayChangeHint() {
        if (!changeMode || changeView !== 'hint' || busy || solved) return;
        hintPhase = 0;
        busy = true;
        applyDisplayMode();
        await playChangeHintAnim();
        busy = false;
        applyDisplayMode();
    }

    function backToChangeQuiz() {
        hintPhase = 0;
        leftNum = changeStartL;
        rightNum = changeStartR;
        changeView = 'quiz';
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        if (!solved) {
            choicesEl.classList.remove('hidden');
            setChoicesEnabled(true);
        }
        renderChangeQuiz();
        applyDisplayMode();
    }

    async function onChangeChoose(count, button) {
        if (solved || changeView !== 'quiz') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const blank = changeEqTo.querySelector('.eq-blank') || changeEqTo;
        const chip = spawnFlyingNumber(button, count);
        if (count === changeAnswer) {
            await flyFromTo(chip, blank).then(() => chip.remove());
            solved = true;
            renderChangeQuiz();
            const { wasComplete, golden, grew } = await grantSolveReward();
            messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
            choicesEl.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            busy = false;
            applyDisplayMode();
            return;
        }
        if (count > changeAnswer) {
            await spillElement(chip, blank);
        } else {
            await flyFromTo(chip, blank);
            chip.remove();
        }
        changeEqTo.classList.add('shake');
        await wait(1400);
        changeEqTo.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        setChoicesEnabled(true);
        busy = false;
        applyDisplayMode();
    }

    function clearCountMode() {
        countMode = false;
        countPhase = 'idle';
        countShown = 0;
    }

    function pickCountPair() {
        const pairs = [];
        for (let small = 1; small <= 3; small++) {
            for (let large = small + 1; large <= 9; large++) {
                if (large + small > 10) continue;
                pairs.push([large, small]);
            }
        }
        let choices = pairs;
        if (lastLeft !== null && pairs.length > 1) {
            const filtered = pairs.filter(([large, small]) => {
                const same = (lastLeft === large && lastRight === small)
                    || (lastLeft === small && lastRight === large);
                return !same;
            });
            if (filtered.length) choices = filtered;
        }
        const [large, small] = choices[randInt(0, choices.length - 1)];
        if (Math.random() < 0.5) return [large, small];
        return [small, large];
    }

    function setBallNumber(ball, n) {
        if (!ball) return;
        const target = ball.classList.contains('ball') ? ball : ball.querySelector('.ball');
        if (!target) return;
        let num = target.querySelector('.ball-num');
        if (!num) {
            num = document.createElement('span');
            num.className = 'ball-num';
            target.appendChild(num);
        }
        num.textContent = String(n);
    }

    function countRoles() {
        if (leftNum > rightNum) {
            return {
                destBoxes: leftBoxes,
                srcBoxes: rightBoxes,
                larger: leftNum,
                smaller: rightNum
            };
        }
        return {
            destBoxes: rightBoxes,
            srcBoxes: leftBoxes,
            larger: rightNum,
            smaller: leftNum
        };
    }

    async function beginCountLabel() {
        if (!countMode || busy || solved || countPhase !== 'idle') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const { destBoxes, larger } = countRoles();
        const startBox = lastFilledBox(destBoxes);
        const startBall = startBox ? startBox.querySelector('.ball') : null;
        if (startBall && showBalls) {
            messageEl.innerHTML = `<strong>${larger}</strong> から かぞえよう`;
            await blinkPico([startBall]);
            if (!countMode) return;
            setBallNumber(startBall, larger);
        }
        countShown = larger;
        countPhase = 'labeled';
        busy = false;
        if (!solved) setChoicesEnabled(true);
        applyDisplayMode();
    }

    async function continueCountMoves() {
        if (!countMode || busy || solved || countPhase !== 'labeled') return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();
        const { destBoxes, srcBoxes } = countRoles();
        let n = countShown;
        while (countMode && !solved) {
            const src = lastFilledBox(srcBoxes);
            const dest = firstEmptyBox(destBoxes);
            const ball = src ? src.querySelector('.ball') : null;
            if (!ball || !dest) break;
            n += 1;
            const fly = spawnFlyingBall(ball);
            ball.remove();
            await flyBallToBox(fly, dest, null, n);
            countShown = n;
            if (!countMode || solved) break;
            if (!lastFilledBox(srcBoxes) || !firstEmptyBox(destBoxes)) break;
            await wait(1000);
        }
        countPhase = 'done';
        hintPhase = 2;
        busy = false;
        messageEl.innerHTML = promptMessage();
        if (!solved) setChoicesEnabled(true);
        applyDisplayMode();
    }

    function resetCountBoard() {
        document.querySelectorAll('.ball.flying').forEach((el) => el.remove());
        countPhase = 'idle';
        countShown = 0;
        hintPhase = 0;
        renderKastens();
        refreshEquation();
        messageEl.innerHTML = promptMessage();
    }

    function startCount() {
        if (busy) return;
        document.querySelectorAll('.ball.flying').forEach((el) => el.remove());
        drillCount = null;
        drillItems = [];
        drillFocus = null;
        drillView = 'list';
        huntTarget = null;
        huntItems = [];
        huntFocus = null;
        huntView = 'list';
        clearShiftMode();
        clearChangeMode();
        countMode = true;
        countPhase = 'idle';
        countShown = 0;
        busy = false;
        solved = false;
        hintPhase = 0;
        const picked = pickCountPair();
        leftNum = picked[0];
        rightNum = picked[1];
        lastLeft = leftNum;
        lastRight = rightNum;
        nextBtn.classList.add('hidden');
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        messageEl.innerHTML = promptMessage();
        renderKastens();
        applyDisplayMode();
    }

    function initGame() {
        clearShiftMode();
        clearChangeMode();
        clearCountMode();
        busy = false;
        solved = false;
        hintPhase = 0;
        [leftNum, rightNum] = pickAddends();

        messageEl.innerHTML = promptMessage();
        nextBtn.classList.add('hidden');
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        renderKastens();
        applyDisplayMode();
    }

    function resolveMoveDir() {
        if (moveMode === 'ltr') return 'ltr';
        if (moveMode === 'small-large') {
            if (leftNum < rightNum) return 'ltr';
            if (rightNum < leftNum) return 'rtl';
            return 'rtl';
        }
        if (moveMode === 'large-small') {
            if (leftNum > rightNum) return 'ltr';
            if (rightNum > leftNum) return 'rtl';
            return 'rtl';
        }
        return 'rtl';
    }

    function combineMessage(dir) {
        if (dir === 'rtl') return 'あおだま が ひだり に あつまるよ！';
        return 'あかだま が みぎ に あつまるよ！';
    }

    function spawnFlyingBall(ball) {
        const rect = ball.getBoundingClientRect();
        const fly = document.createElement('div');
        fly.className = ball.className.replace('landed', 'flying').replace('pico', '').trim();
        fly.style.left = `${rect.left}px`;
        fly.style.top = `${rect.top}px`;
        document.body.appendChild(fly);
        return fly;
    }

    async function flyBallToBox(fly, box, colorOverride = null, label = null) {
        const from = fly.getBoundingClientRect();
        const to = box.getBoundingClientRect();
        const dx = to.left + (to.width - from.width) / 2 - from.left;
        const dy = to.top + (to.height - from.height) / 2 - from.top;
        await fly.animate([
            { transform: 'translate(0, 0) scale(1)' },
            { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) scale(1.06)` },
            { transform: `translate(${dx}px, ${dy}px) scale(1)` }
        ], {
            duration: 1000,
            easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
            fill: 'forwards'
        }).finished;

        const color = colorOverride || (fly.classList.contains('red') ? 'red' : 'blue');
        const landed = document.createElement('div');
        landed.className = `ball ${color} landed`;
        if (label != null) {
            const num = document.createElement('span');
            num.className = 'ball-num';
            num.textContent = String(label);
            landed.appendChild(num);
        }
        box.appendChild(landed);
        fly.remove();
    }

    function moveOrderBoxes(boxes) {
        const bottom = boxes.slice(0, 5);
        const top = boxes.slice(5, 10);
        return [...top].reverse().concat([...bottom].reverse());
    }

    function hasBall(box) {
        return Boolean(box.querySelector('.ball'));
    }

    function emptyBoxes(boxes) {
        return boxes.filter((box) => !hasBall(box));
    }

    function filledBoxes(boxes) {
        return boxes.filter(hasBall);
    }

    function getRoles() {
        if (leftNum >= rightNum) {
            return {
                destBoxes: leftBoxes,
                srcBoxes: rightBoxes,
                larger: leftNum,
                smaller: rightNum
            };
        }
        return {
            destBoxes: rightBoxes,
            srcBoxes: leftBoxes,
            larger: rightNum,
            smaller: leftNum
        };
    }

    function hintKind() {
        const sum = leftNum + rightNum;
        const larger = Math.max(leftNum, rightNum);
        if (sum <= 5) return 'to-larger';
        if (sum <= 10 && larger <= 4) return 'make5';
        if (sum <= 10) return 'to-larger';
        return 'make10';
    }

    function pickSrcBoxes(srcBoxes, count) {
        if (count <= 0) return [];
        const topRightFirst = [...filledBoxes(srcBoxes.slice(5, 10))].reverse();
        const bottomRightFirst = [...filledBoxes(srcBoxes.slice(0, 5))].reverse();
        return [...topRightFirst, ...bottomRightFirst].slice(0, count);
    }

    async function blinkPico(els) {
        if (!els.length) return;
        els.forEach((el) => el.classList.add('pico'));
        await wait(2000);
        els.forEach((el) => el.classList.remove('pico'));
    }

    async function moveBallsTo(srcBoxList, destBoxList) {
        const count = Math.min(srcBoxList.length, destBoxList.length);
        const jobs = [];
        for (let i = 0; i < count; i++) {
            const ball = srcBoxList[i].querySelector('.ball');
            if (!ball) continue;
            const fly = spawnFlyingBall(ball);
            ball.remove();
            jobs.push({ fly, target: destBoxList[i], delay: i * 80 });
        }
        await Promise.all(jobs.map(async ({ fly, target, delay }) => {
            await wait(delay);
            await flyBallToBox(fly, target);
        }));
    }

    async function hintMoveAllToLarger() {
        const { destBoxes, srcBoxes } = getRoles();
        const moving = filledBoxes(srcBoxes);
        const dest = emptyBoxes(destBoxes);
        messageEl.innerHTML = 'すくないほう の たま が うごくよ！';
        await blinkPico(moving.map((box) => box.querySelector('.ball')).filter(Boolean));
        await moveBallsTo(moving, dest);
        hintPhase = 2;
    }

    async function hintMake5First() {
        const { destBoxes, srcBoxes } = getRoles();
        const holes = emptyBoxes(destBoxes.slice(0, 5));
        const moving = pickSrcBoxes(srcBoxes, holes.length);
        messageEl.innerHTML = 'まず したの あきます を うめよう';
        await blinkPico(holes);
        messageEl.innerHTML = 'みぎはし の たま が うごくよ！';
        await blinkPico(moving.map((box) => box.querySelector('.ball')).filter(Boolean));
        await moveBallsTo(moving, holes);
        hintPhase = filledBoxes(srcBoxes).length ? 1 : 2;
    }

    async function hintMake10First() {
        const { destBoxes, srcBoxes, smaller } = getRoles();
        const holes = emptyBoxes(destBoxes.slice(5, 10));
        const moving = pickSrcBoxes(srcBoxes, holes.length);
        messageEl.innerHTML = 'まず うえの あきます を うめて<br>10 をつくろう';
        await blinkPico(holes);
        messageEl.innerHTML = smaller >= 6
            ? 'うえの みぎ から たま が うごくよ！'
            : 'みぎはし の たま が うごくよ！';
        await blinkPico(moving.map((box) => box.querySelector('.ball')).filter(Boolean));
        await moveBallsTo(moving, holes);
        hintPhase = 2;
    }

    async function hintMoveRemaining() {
        const { destBoxes, srcBoxes } = getRoles();
        const remaining = filledBoxes(srcBoxes);
        const dest = emptyBoxes(destBoxes);
        if (!remaining.length || !dest.length) {
            hintPhase = 2;
            return;
        }
        messageEl.innerHTML = 'のこりの たま も いこう！';
        await blinkPico(remaining.map((box) => box.querySelector('.ball')).filter(Boolean));
        await moveBallsTo(remaining, dest);
        hintPhase = 2;
    }

    async function onHint() {
        if (countMode) return;
        if (changeMode) {
            await openChangeHint();
            return;
        }
        if (busy || solved || !showBalls || hintPhase >= 2) return;
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();

        const kind = hintKind();
        if (hintPhase === 0) {
            if (kind === 'to-larger') await hintMoveAllToLarger();
            else if (kind === 'make5') await hintMake5First();
            else await hintMake10First();
        } else {
            await hintMoveRemaining();
        }

        messageEl.innerHTML = promptMessage();
        busy = false;
        if (!isHintView()) setChoicesEnabled(true);
        updateHintButton();
    }

    async function animateCombine() {
        if (!showBalls) return;
        let sourceBoxes;
        let destBoxes;
        if (hintPhase > 0) {
            const roles = getRoles();
            sourceBoxes = roles.srcBoxes;
            destBoxes = roles.destBoxes;
        } else {
            const dir = resolveMoveDir();
            sourceBoxes = dir === 'rtl' ? rightBoxes : leftBoxes;
            destBoxes = dir === 'rtl' ? leftBoxes : rightBoxes;
        }
        const sourceBalls = moveOrderBoxes(sourceBoxes)
            .map((box) => box.querySelector('.ball'))
            .filter(Boolean);
        const emptyDest = destBoxes.filter((box) => !box.querySelector('.ball'));
        const moveCount = Math.min(sourceBalls.length, emptyDest.length);

        const jobs = sourceBalls.slice(0, moveCount).map((ball, i) => {
            const fly = spawnFlyingBall(ball);
            ball.remove();
            return { fly, target: emptyDest[i], delay: i * 40 };
        });

        await Promise.all(jobs.map(async ({ fly, target, delay }) => {
            await wait(delay);
            await flyBallToBox(fly, target);
        }));
    }

    function spawnFlyingNumber(fromEl, value) {
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'num-chip';
        chip.textContent = String(value);
        chip.style.left = `${rect.left + (rect.width - 56) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 56) / 2}px`;
        document.body.appendChild(chip);
        return chip;
    }

    function flyFromTo(el, targetEl) {
        const from = el.getBoundingClientRect();
        const to = targetEl.getBoundingClientRect();
        const dx = to.left + (to.width - from.width) / 2 - from.left;
        const dy = to.top + (to.height - from.height) / 2 - from.top;
        return el.animate([
            { transform: 'translate(0, 0) scale(1)' },
            { transform: `translate(${dx * 0.55}px, ${dy * 0.45 - 70}px) scale(1.12)` },
            { transform: `translate(${dx}px, ${dy}px) scale(1)` }
        ], {
            duration: 520,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
        }).finished;
    }

    async function spillElement(el, targetEl) {
        const from = el.getBoundingClientRect();
        const target = targetEl.getBoundingClientRect();
        const towardX = target.right - from.left - from.width / 2 + 12;
        const towardY = target.top - from.top;
        const fallX = towardX + 50 + Math.random() * 30;
        const fallY = window.innerHeight - from.top + 40;

        await el.animate([
            { transform: 'translate(0, 0) rotate(0deg) scale(1)' },
            { transform: `translate(${towardX}px, ${towardY - 20}px) rotate(25deg) scale(1.05)` }
        ], {
            duration: 360,
            easing: 'ease-out',
            fill: 'forwards'
        }).finished;

        await el.animate([
            { transform: `translate(${towardX}px, ${towardY - 20}px) rotate(25deg) scale(1.05)` },
            { transform: `translate(${fallX}px, ${fallY}px) rotate(420deg) scale(0.85)` }
        ], {
            duration: 760,
            easing: 'cubic-bezier(0.55, 0.09, 0.68, 0.2)',
            fill: 'forwards'
        }).finished;

        el.remove();
    }

    async function grantSolveReward() {
        const wasComplete = harvestDone;
        const prevSolves = solves;
        solves += 1;
        const golden = solves % GOLDEN_EVERY === 0;
        const canPlace = apples.length < HARVEST_GOAL;
        const canReplace = golden && apples.some((apple) => !apple.golden);
        if (canPlace || canReplace) {
            await animateFruitToTree(golden);
            collectApple(golden);
        }
        if (!wasComplete && solves >= HARVEST_GOAL) {
            completeHarvest();
        }
        let grew = '';
        if (prevSolves >= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX + STAR_MAX) {
            grew = 'star';
        } else if (prevSolves >= HARVEST_GOAL + GRASS_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            grew = 'flower';
        } else if (prevSolves >= HARVEST_GOAL && prevSolves < HARVEST_GOAL + GRASS_MAX) {
            grew = 'grass';
        }
        saveState();
        refreshOrchard(grew);
        return { wasComplete, golden, grew };
    }

    function rewardMessage(wasComplete, golden, grew) {
        if (!wasComplete && harvestDone) {
            return golden
                ? '<span style="color:#ff4081; font-size:32px;">🎉 しゅうかく かんせい！ 🎉</span><br>きんのりんご も なったよ！'
                : '<span style="color:#ff4081; font-size:32px;">🎉 きょうのしゅうかく かんせい！ 🎉</span>';
        }
        if (golden) return '<span style="color:#ff8f00; font-size:32px;">✨ きんのりんご！ ✨</span>';
        if (grew === 'grass') return '<span style="color:#43a047; font-size:32px;">🌱 くさが はえたよ！</span>';
        if (grew === 'flower') return '<span style="color:#ec407a; font-size:32px;">🌸 はなが さいたよ！</span>';
        if (grew === 'star') return '<span style="color:#5c6bc0; font-size:32px;">⭐ ほしが できたよ！</span>';
        return '<span style="color:#ff4081; font-size:32px;">🎉 大せいかい！ 🎉</span>';
    }

    async function onDrillChoose(count, button) {
        const index = drillFocus;
        const item = index != null ? drillItems[index] : null;
        if (!item || item.solved) return;
        busy = true;
        setChoicesEnabled(false);
        const answer = item.left + item.right;
        const row = drillList.querySelectorAll('.drill-item')[index];
        const blank = row ? row.querySelector('.eq-blank-btn') : null;
        let mark = row ? row.querySelector('.drill-mark') : null;
        if (row && !mark) {
            mark = document.createElement('span');
            mark.className = 'drill-mark';
            row.appendChild(mark);
        }
        const chip = spawnFlyingNumber(button, count);
        const target = blank || button;

        if (count === answer) {
            await flyFromTo(chip, target).then(() => chip.remove());
            item.solved = true;
            lastLeft = item.left;
            lastRight = item.right;
            await grantSolveReward();
            drillFocus = null;
            renderDrillList();
            choicesEl.classList.add('hidden');
            busy = false;
            applyDisplayMode();
            return;
        }

        if (mark) {
            mark.classList.add('wrong');
            mark.textContent = count > answer ? 'おおすぎるよ' : 'たりないよ';
        }
        if (count > answer) {
            await spillElement(chip, target);
        } else {
            await flyFromTo(chip, target);
            chip.remove();
        }
        if (row) row.classList.add('shake');
        await wait(1400);
        if (row) row.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        if (mark) {
            mark.classList.remove('wrong');
            mark.textContent = '';
        }
        setChoicesEnabled(true);
        busy = false;
    }

    async function onChoose(count, button) {
        if (busy) return;
        if (shiftMode) return;
        if (changeMode) {
            await onChangeChoose(count, button);
            return;
        }
        if (isHintView()) return;
        if (isDrillList()) {
            await onDrillChoose(count, button);
            return;
        }
        busy = true;
        setChoicesEnabled(false);
        updateHintButton();

        const answer = leftNum + rightNum;
        const chip = spawnFlyingNumber(button, count);
        const blank = equationEl.querySelector('.eq-blank') || equationEl;

        if (count === answer) {
            if (countMode) {
                await flyFromTo(chip, blank).then(() => chip.remove());
                solved = true;
                hintPhase = 2;
                const { wasComplete, golden, grew } = await grantSolveReward();
                refreshEquation(count);
                messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);
                choicesEl.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                busy = false;
                updateHintButton();
                return;
            }
            const dir = hintPhase > 0
                ? (leftNum >= rightNum ? 'rtl' : 'ltr')
                : resolveMoveDir();
            messageEl.innerHTML = combineMessage(dir);
            await Promise.all([
                flyFromTo(chip, blank).then(() => chip.remove()),
                animateCombine()
            ]);
            solved = true;
            hintPhase = 2;
            const { wasComplete, golden, grew } = await grantSolveReward();
            refreshEquation(count);
            messageEl.innerHTML = rewardMessage(wasComplete, golden, grew);

            choicesEl.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            busy = false;
            updateHintButton();
            return;
        }

        if (count > answer) {
            messageEl.innerHTML = `わあっ！ <strong>おおすぎるよ！</strong><br>${leftNum} + ${rightNum} は ${count} より ちいさいよ`;
            await spillElement(chip, blank);
            equationEl.classList.add('shake');
            kastensEl.classList.add('shake');
        } else {
            messageEl.innerHTML = `まだ <strong>たりないよ！</strong><br>${leftNum} + ${rightNum} は ${count} より おおきいよ`;
            await flyFromTo(chip, blank);
            chip.remove();
            refreshEquation(count);
            equationEl.classList.add('shake');
            kastensEl.classList.add('shake');
        }

        await wait(1400);
        equationEl.classList.remove('shake');
        kastensEl.classList.remove('shake');
        document.querySelectorAll('.num-chip').forEach((el) => el.remove());
        messageEl.innerHTML = promptMessage();
        refreshEquation();
        setChoicesEnabled(true);
        busy = false;
        updateHintButton();
    }

    function buildChoiceButtons() {
        choiceRow.innerHTML = '';
        for (let n = 1; n <= 18; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'choice-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => onChoose(n, btn));
            choiceRow.appendChild(btn);
        }
    }

    function buildFixButtons() {
        fixGrid.innerHTML = '';
        for (let n = 1; n <= 9; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'fix-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => {
                if (fixedDigit === n) return;
                fixedDigit = n;
                refreshProblems();
            });
            fixGrid.appendChild(btn);
        }
    }

    function buildSumButtons() {
        sumGrid.innerHTML = '';
        for (let n = 1; n <= 18; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sum-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => {
                if (selectedSums.has(n)) {
                    selectedSums.delete(n);
                    if (selectedSums.size === 0) sumMode = 'random';
                } else {
                    selectedSums.add(n);
                    sumMode = 'picks';
                }
                refreshProblems();
            });
            sumGrid.appendChild(btn);
        }
    }

    function buildEnshuButtons() {
        enshuGrid.innerHTML = '';
        for (let n = 1; n <= 20; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sum-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => startDrill(n));
            enshuGrid.appendChild(btn);
        }
    }

    function buildHuntButtons() {
        huntGrid.innerHTML = '';
        for (let n = 1; n <= 18; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sum-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => startHunt(n));
            huntGrid.appendChild(btn);
        }
    }

    function setFixTarget(side) {
        if (fixTarget === side) return;
        fixTarget = side;
        if (fixedDigit === null) {
            applyDisplayMode();
            return;
        }
        refreshProblems();
    }

    fixLeftTab.addEventListener('click', () => setFixTarget('left'));
    fixRightTab.addEventListener('click', () => setFixTarget('right'));

    randomLeftBtn.addEventListener('click', () => {
        if (fixedDigit === null) return;
        fixedDigit = null;
        refreshProblems();
    });

    randomSumBtn.addEventListener('click', () => {
        if (sumMode === 'random' && selectedSums.size === 0) return;
        sumMode = 'random';
        selectedSums.clear();
        refreshProblems();
    });

    le10Btn.addEventListener('click', () => {
        if (sumMode === 'le10') return;
        sumMode = 'le10';
        selectedSums.clear();
        refreshProblems();
    });

    le5Btn.addEventListener('click', () => {
        if (sumMode === 'le5') return;
        sumMode = 'le5';
        selectedSums.clear();
        refreshProblems();
    });

    async function resetHintToStart() {
        if (countMode) {
            if (busy || solved) return;
            resetCountBoard();
            applyDisplayMode();
            return;
        }
        if (changeMode) {
            await replayChangeHint();
            return;
        }
        if (busy || solved || hintPhase === 0) return;
        hintPhase = 0;
        messageEl.innerHTML = promptMessage();
        if (!isHintView()) setChoicesEnabled(true);
        renderKastens();
        applyDisplayMode();
    }

    hintBtn.addEventListener('click', onHint);
    resetHintBtn.addEventListener('click', resetHintToStart);
    backBtn.addEventListener('click', backToList);
    drillQuitBtn.addEventListener('click', quitActivity);
    drillPrintBtn.addEventListener('click', printDrill);
    shiftStartBtn.addEventListener('click', startShift);
    shiftToRightBtn.addEventListener('click', () => shiftOne(true));
    shiftToLeftBtn.addEventListener('click', () => shiftOne(false));
    shiftDoneBtn.addEventListener('click', completeShift);
    shiftQuitBtn.addEventListener('click', quitActivity);
    changeQuitBtn.addEventListener('click', quitActivity);
    changeOps.querySelectorAll('[data-change]').forEach((btn) => {
        btn.addEventListener('click', () => startChange(btn.dataset.change));
    });
    countStartBtn.addEventListener('click', () => startCount());
    countAnimStartBtn.addEventListener('click', () => beginCountLabel());
    countContinueBtn.addEventListener('click', () => continueCountMoves());
    countQuitBtn.addEventListener('click', quitActivity);

    function printDrill() {
        updatePrintMeta();
        document.body.classList.add('print-drill');
        const done = () => {
            document.body.classList.remove('print-drill');
            window.removeEventListener('afterprint', done);
        };
        window.addEventListener('afterprint', done);
        window.print();
    }

    document.querySelectorAll('.ctrl-btn[data-setting]').forEach((btn) => {
        btn.addEventListener('click', () => {
            const on = btn.dataset.value === 'on';
            if (btn.dataset.setting === 'grid') showGrid = on;
            if (btn.dataset.setting === 'balls') {
                showBalls = on;
                if (on) showGrid = true;
            }
            applyDisplayMode();
            if (isHuntList()) renderHuntList();
            else if (isDrillList()) renderDrillList();
            if (changeMode) {
                if (changeView === 'quiz' && !solved) renderChangeQuiz();
                if (changeView === 'hint' && !busy) renderKastens();
            } else if (countMode) {
                if (!busy && !solved) {
                    renderKastens();
                    messageEl.innerHTML = promptMessage();
                }
            } else if (shiftMode) {
                if (!busy) renderKastens();
                if (!solved) messageEl.innerHTML = shiftPrompt();
            } else if (!busy && !solved && !isListView()) {
                messageEl.innerHTML = promptMessage();
            }
        });
    });

    document.querySelectorAll('.move-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
            moveMode = btn.dataset.move;
            applyDisplayMode();
        });
    });

    nextBtn.addEventListener('click', () => {
        if (countMode) startCount();
        else if (changeMode) startChange(changeOpSelected);
        else if (shiftMode) startShift();
        else initGame();
    });
    loadState();
    refreshOrchard();
    buildFixButtons();
    buildSumButtons();
    buildEnshuButtons();
    buildHuntButtons();
    buildChoiceButtons();
    initGame();
</script>

</body>
</html>
