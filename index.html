<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たしざん</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
        text-align: center;
        background-color: #f0f8ff;
        color: #333;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
        min-height: 100vh;
    }
    h1 {
        color: #ff8c00;
        font-size: 32px;
        margin: 8px 0 20px;
    }
    .layout {
        display: grid;
        grid-template-columns: 216px minmax(520px, 1fr) 180px;
        justify-content: center;
        align-items: start;
        gap: 16px;
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
    }
    .left-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
    }
    .game-area {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 28px 20px 32px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        position: relative;
        min-width: 0;
        width: 100%;
    }
    .message {
        font-size: 24px;
        font-weight: bold;
        color: #555;
        margin-bottom: 12px;
        min-height: 64px;
    }
    .kastens {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 18px;
        margin: 18px auto 8px;
        flex-wrap: wrap;
    }
    .kasten-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .kasten {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }
    .kasten-row {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
    }
    .plus {
        font-size: 48px;
        font-weight: bold;
        color: #ff4081;
        line-height: 1;
        padding-bottom: 28px;
    }
    .box {
        width: 52px;
        height: 52px;
        border: 3px solid #4caf50;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #e8f5e9;
        transition: background-color 0.2s, transform 0.15s, border-color 0.2s;
    }
    .box.shake,
    .equation.shake,
    .change-eq.shake,
    .kastens.shake {
        animation: shake 0.45s ease-in-out;
    }
    .ball {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    .ball-num {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        font-family: inherit;
        line-height: 1;
        text-shadow: 0 1px 2px rgba(0,0,0,0.45);
        pointer-events: none;
    }
    .ball.landed {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ball.pico {
        animation: picoBall 0.4s ease-in-out infinite;
        z-index: 2;
    }
    .box.pico {
        animation: picoBox 0.4s ease-in-out infinite;
        border-color: #ff9800 !important;
        background-color: #fff8e1 !important;
    }
    .ball.flying,
    .fruit-chip {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        will-change: transform;
        animation: none;
    }
    .num-chip {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        will-change: transform;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: #ff4081;
        color: #fff;
        font-size: 26px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(255, 64, 129, 0.35);
    }
    .red { background-color: #ff5252; }
    .blue { background-color: #448aff; }

    .game-area.no-grid .box {
        border-color: transparent;
        background-color: transparent;
    }
    .game-area.no-balls .ball {
        visibility: hidden;
    }
    .game-area.no-balls .box:has(.red) {
        background-color: #ffcdd2;
        border-color: #e57373;
    }
    .game-area.no-balls .box:has(.blue) {
        background-color: #bbdefb;
        border-color: #64b5f6;
    }
    .game-area.no-grid.no-balls .box:has(.red),
    .game-area.no-grid.no-balls .box:has(.blue) {
        background-color: transparent;
        border-color: transparent;
    }
    .game-area.no-grid.no-balls .kastens,
    .game-area.no-grid.no-balls .plus {
        display: none;
    }
    .game-area.no-grid.no-balls .equation {
        font-size: 64px;
        min-height: 90px;
        margin: 36px 0 20px;
    }
    .game-area.no-grid.no-balls .hint-row {
        display: none !important;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px) rotate(-2deg); }
        40% { transform: translateX(8px) rotate(2deg); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
    }
    @keyframes picoBall {
        0%, 100% { transform: scale(1); filter: brightness(1); box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2); }
        50% { transform: scale(1.28); filter: brightness(1.35); box-shadow: 0 0 0 4px #fff59d, 0 0 16px 6px #ffeb3b; }
    }
    @keyframes picoBox {
        0%, 100% { transform: scale(1); box-shadow: none; }
        50% { transform: scale(1.08); box-shadow: 0 0 0 3px #ffcc80, 0 0 12px #ff9800; }
    }
    @keyframes tree-bloom {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.08); }
        70% { transform: scale(0.96); }
    }
    @keyframes sparkle {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.35); }
    }
    @keyframes grass-grow {
        0% { transform: translateX(-50%) scaleY(0); }
        70% { transform: translateX(-50%) scaleY(1.15); }
        100% { transform: translateX(-50%) scaleY(1); }
    }
    @keyframes bloom-pop {
        0% { transform: translateX(-50%) scale(0); }
        80% { transform: translateX(-50%) scale(1.25); }
        100% { transform: translateX(-50%) scale(1); }
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.55; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes star-pop {
        0% { transform: scale(0); }
        80% { transform: scale(1.5); }
        100% { transform: scale(1); }
    }

    .equation {
        font-size: 42px;
        font-weight: bold;
        color: #ff4081;
        margin: 12px 0 8px;
        min-height: 56px;
        letter-spacing: 4px;
        transition: font-size 0.2s, margin 0.2s;
    }
    .eq-red { color: #ff5252; }
    .eq-blue { color: #448aff; }
    .eq-sum { color: #ff4081; }
    .eq-blank {
        color: #90a4ae;
        display: inline-block;
        min-width: 1.1em;
    }

    .enshu-block {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eceff1;
    }
    .hunt-block,
    .shift-block,
    .change-block,
    .count-block {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eceff1;
    }
    .enshu-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
    }

    .drill-panel {
        text-align: center;
    }
    .drill-head {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        min-height: 40px;
        margin-bottom: 10px;
        gap: 8px;
    }
    .drill-title {
        grid-column: 2;
        font-size: 20px;
        font-weight: bold;
        color: #555;
        margin: 0;
        white-space: nowrap;
    }
    .drill-actions {
        grid-column: 3;
        justify-self: end;
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        align-items: center;
    }
    .print-meta {
        display: none;
    }
    .drill-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 460px;
        margin: 0 auto 12px;
        max-height: 58vh;
        overflow-y: auto;
        padding: 4px 4px 8px;
    }
    .drill-list.hunt-board {
        display: grid;
        grid-template-columns: 1fr 1fr;
        max-width: none;
        width: 100%;
        gap: 6px 20px;
        max-height: 64vh;
    }
    .hunt-board .drill-item {
        font-size: 22px;
        min-height: 44px;
        justify-content: flex-start;
        gap: 8px;
        min-width: 0;
        flex-wrap: nowrap;
        letter-spacing: 1px;
    }
    .hunt-board .drill-item-eq {
        min-width: 0;
        flex: 1;
        white-space: nowrap;
    }
    .hunt-eq-btn {
        border: none;
        background: transparent;
        padding: 0;
        margin: 0;
        font: inherit;
        font-weight: bold;
        font-family: inherit;
        letter-spacing: inherit;
        color: inherit;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
    }
    .hunt-eq-btn:disabled {
        cursor: default;
    }
    .treasure-prize {
        width: 36px;
        height: 32px;
        flex-shrink: 0;
        display: inline-block;
        line-height: 0;
    }
    .treasure-prize svg {
        display: block;
    }
    .drill-item {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 3px;
        min-height: 52px;
    }
    .drill-item.shake {
        animation: shake 0.45s ease-in-out;
    }
    .drill-item-eq {
        min-width: 7.2em;
        text-align: left;
    }
    .drill-item.focused .eq-blank-btn {
        background: #fff8e1;
        box-shadow: 0 0 0 3px #ffcc80;
        color: #ff9800;
    }
    .eq-blank-btn {
        border: none;
        background: #eceff1;
        color: #90a4ae;
        font-size: inherit;
        font-weight: bold;
        font-family: inherit;
        min-width: 1.15em;
        line-height: 1.15;
        padding: 0 4px;
        border-radius: 8px;
        cursor: pointer;
        letter-spacing: 0;
    }
    .eq-blank-btn:hover:not(:disabled) {
        background: #fff8e1;
    }
    .eq-blank-btn:disabled {
        cursor: default;
    }
    .drill-hint-mini {
        font-size: 15px;
        padding: 6px 12px;
        border-radius: 16px;
        letter-spacing: 0;
        box-shadow: 0 3px 0 #f9a825;
        flex-shrink: 0;
    }
    .drill-hint-mini:active:not(:disabled) {
        box-shadow: 0 1px 0 #f9a825;
    }
    .drill-mark {
        font-size: 16px;
        letter-spacing: 0;
        color: #ff4081;
        min-width: 5.5em;
        text-align: left;
        flex-shrink: 0;
    }
    .drill-mark.wrong {
        color: #e53935;
    }
    .drill-done {
        font-size: 24px;
        font-weight: bold;
        color: #ff4081;
        margin: 12px 0 0;
    }
    .hint-btn.back-btn {
        background-color: #90caf9;
        color: #0d47a1;
        box-shadow: 0 4px 0 #42a5f5;
        margin-top: 6px;
    }
    .hint-btn.back-btn:active:not(:disabled) {
        box-shadow: 0 2px 0 #42a5f5;
    }

    .game-area.in-drill-list .message,
    .game-area.in-drill-list .kastens,
    .game-area.in-drill-list .equation,
    .game-area.in-drill-list .hint-row,
    .game-area.in-drill-list .next-btn,
    .game-area.in-drill-list .back-btn {
        display: none !important;
    }
    .game-area.in-drill-hint .drill-panel,
    .game-area.in-drill-hint .choices,
    .game-area.in-drill-hint .next-btn {
        display: none !important;
    }

    .game-area.in-shift {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .game-area.in-shift .message { order: 1; }
    .game-area.in-shift .equation { order: 2; }
    .game-area.in-shift .kastens { order: 3; }
    .game-area.in-shift .shift-panel { order: 4; }
    .game-area.in-shift .next-btn { order: 5; }
    .game-area.in-shift .hint-row,
    .game-area.in-shift .back-btn,
    .game-area.in-shift .drill-panel,
    .game-area.in-shift .choices {
        display: none !important;
    }

    .shift-panel {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
        width: 100%;
    }
    .game-area.in-shift .shift-panel {
        display: flex;
    }
    .shift-arrows {
        display: flex;
        justify-content: center;
        gap: 28px;
    }
    .shift-arrow {
        width: 92px;
        height: 68px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s, filter 0.15s;
        font-family: inherit;
        padding: 8px 10px;
    }
    .shift-arrow svg {
        width: 68px;
        height: 44px;
        display: block;
    }
    .shift-arrow.to-right {
        background: #ffcdd2;
        box-shadow: 0 4px 0 #e57373;
        color: #c62828;
    }
    .shift-arrow.to-left {
        background: #bbdefb;
        box-shadow: 0 4px 0 #64b5f6;
        color: #1565c0;
    }
    .shift-arrow:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.05);
    }
    .shift-arrow:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #e57373;
    }
    .shift-arrow.to-left:active:not(:disabled) {
        box-shadow: 0 2px 0 #64b5f6;
    }
    .shift-arrow:disabled {
        cursor: default;
        opacity: 0.4;
    }
    .shift-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .shift-done {
        background-color: #66bb6a;
        color: #fff;
        border: none;
        padding: 12px 36px;
        font-size: 22px;
        font-weight: bold;
        border-radius: 28px;
        cursor: pointer;
        box-shadow: 0 4px 0 #43a047;
        font-family: inherit;
        transition: transform 0.15s;
    }
    .shift-done:hover:not(:disabled) {
        transform: translateY(-2px);
    }
    .shift-done:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #43a047;
    }
    .shift-done:disabled {
        cursor: default;
        opacity: 0.45;
    }

    .change-ops {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
    }
    .change-ops .ctrl-btn {
        font-size: 16px;
        padding: 8px 4px;
    }
    .change-ops .ctrl-btn.change-random {
        grid-column: 1 / -1;
        font-size: 18px;
        padding: 10px 8px;
    }
    .change-panel {
        display: none;
        width: 100%;
        text-align: center;
    }
    .change-eqs {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: 8px 0 4px;
    }
    .change-eq {
        font-size: 38px;
        font-weight: bold;
        letter-spacing: 3px;
        color: #ff4081;
        min-height: 52px;
    }
    .change-caption {
        font-size: 16px;
        font-weight: bold;
        color: #78909c;
        margin: 0;
        letter-spacing: 0.04em;
    }

    .game-area.in-change-quiz {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .game-area.in-change-quiz .change-panel {
        display: block;
        order: 1;
    }
    .game-area.in-change-quiz .hint-row { order: 2; }
    .game-area.in-change-quiz .choices { order: 3; }
    .game-area.in-change-quiz .next-btn { order: 4; }
    .game-area.in-change-quiz .message,
    .game-area.in-change-quiz .kastens,
    .game-area.in-change-quiz .equation,
    .game-area.in-change-quiz .shift-panel,
    .game-area.in-change-quiz .drill-panel,
    .game-area.in-change-quiz .back-btn {
        display: none !important;
    }
    .game-area.in-change-quiz.change-solved .message {
        display: block !important;
        order: 0;
    }

    .game-area.in-change-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .game-area.in-change-hint .message { order: 1; }
    .game-area.in-change-hint .equation { order: 2; }
    .game-area.in-change-hint .kastens { order: 3; }
    .game-area.in-change-hint .hint-row { order: 4; }
    .game-area.in-change-hint .back-btn { order: 5; }
    .game-area.in-change-hint .next-btn { order: 6; }
    .game-area.in-change-hint .change-panel,
    .game-area.in-change-hint .choices,
    .game-area.in-change-hint .shift-panel,
    .game-area.in-change-hint .drill-panel {
        display: none !important;
    }

    .game-area.in-count .shift-panel,
    .game-area.in-count .change-panel,
    .game-area.in-count .drill-panel,
    .game-area.in-count .back-btn {
        display: none !important;
    }

    .hint-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 4px 0 10px;
        flex-wrap: wrap;
    }
    .hint-btn {
        background-color: #ffd54f;
        color: #5d4037;
        border: none;
        padding: 10px 28px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 24px;
        cursor: pointer;
        box-shadow: 0 4px 0 #f9a825;
        transition: transform 0.15s, filter 0.15s;
        font-family: inherit;
    }
    .hint-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.05);
    }
    .hint-btn:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #f9a825;
    }
    .hint-btn:disabled {
        cursor: default;
        opacity: 0.45;
    }
    .hint-btn.drill-print,
    .hint-btn.drill-quit {
        padding: 5px 10px;
        font-size: 14px;
        line-height: 1.2;
        border-radius: 16px;
        white-space: nowrap;
        box-shadow: 0 3px 0 #42a5f5;
    }
    .hint-btn.drill-print {
        background-color: #a5d6a7;
        color: #1b5e20;
        box-shadow: 0 3px 0 #66bb6a;
    }
    .hint-btn.drill-print:active:not(:disabled) {
        box-shadow: 0 1px 0 #66bb6a;
    }
    .hint-btn.drill-quit:active:not(:disabled) {
        box-shadow: 0 1px 0 #42a5f5;
    }
    .hint-btn.count-continue {
        background-color: #81d4fa;
        color: #01579b;
        box-shadow: 0 4px 0 #29b6f6;
    }
    .hint-btn.count-continue:active:not(:disabled) {
        box-shadow: 0 2px 0 #29b6f6;
    }
    .hint-btn.drill-hint-mini {
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 14px;
        letter-spacing: 0;
        box-shadow: 0 3px 0 #f9a825;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .hint-btn.drill-hint-mini:active:not(:disabled) {
        box-shadow: 0 1px 0 #f9a825;
    }
    .reset-hint-btn {
        background-color: #90caf9;
        color: #0d47a1;
        box-shadow: 0 4px 0 #42a5f5;
    }
    .reset-hint-btn:active:not(:disabled) {
        box-shadow: 0 2px 0 #42a5f5;
    }

    .choices {
        margin-top: 8px;
    }
    .choices-label {
        font-size: 22px;
        font-weight: bold;
        color: #1565c0;
        margin-bottom: 14px;
    }
    .choice-row {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 520px;
        margin: 0 auto;
    }
    .choice-btn {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0,0,0,0.18);
        transition: transform 0.15s, filter 0.15s;
    }
    .choice-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.08);
    }
    .choice-btn:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }
    .choice-btn:disabled {
        cursor: default;
        opacity: 0.55;
    }

    .next-btn {
        background-color: #ff9800;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: all 0.2s;
        margin-top: 8px;
        font-family: inherit;
    }
    .next-btn:hover {
        background-color: #f57c00;
        transform: translateY(-2px);
    }

            <div class="ctrl-group">
                <div class="ctrl-label">格子</div>
                <div class="ctrl-btns">

            <div class="ctrl-group">
                <div class="ctrl-label">球</div>
                <div class="ctrl-btns">
                    <button type="button" class="ctrl-btn active" data-setting="balls" data-value="on">あり</button>

<script>
    const HARVEST_GOAL = 30;
    const GRASS_MAX = 10;
    const FLOWER_MAX = 10;
    const STAR_MAX = 24;
    const GOLDEN_EVERY = 10;
    const STORAGE_KEY = 'tashizan-kai-v1';
    const APPLE_SPOTS = [
        { x: 14, y: 36 }, { x: 32, y: 16 }, { x: 50, y: 8 }, { x: 68, y: 14 }, { x: 84, y: 30 },
        { x: 8, y: 52 }, { x: 26, y: 44 }, { x: 44, y: 32 }, { x: 62, y: 36 }, { x: 78, y: 46 },
        { x: 18, y: 64 }, { x: 36, y: 54 }, { x: 54, y: 48 }, { x: 72, y: 58 }, { x: 88, y: 56 },
        { x: 12, y: 22 }, { x: 40, y: 22 }, { x: 58, y: 20 }, { x: 76, y: 24 }, { x: 92, y: 40 },
        { x: 22, y: 30 }, { x: 48, y: 62 }, { x: 64, y: 70 }, { x: 30, y: 72 }, { x: 82, y: 68 },
        { x: 6, y: 38 }, { x: 38, y: 40 }, { x: 56, y: 74 }, { x: 70, y: 8 }, { x: 90, y: 22 }
    ];
    const GRASS_SPOTS = [
        { x: 7, h: 18 }, { x: 17, h: 24 }, { x: 27, h: 16 }, { x: 37, h: 21 },
        { x: 63, h: 19 }, { x: 73, h: 23 }, { x: 83, h: 15 }, { x: 92, h: 20 },
        { x: 12, h: 14 }, { x: 78, h: 17 }
    ];
    const STAR_SPOTS = [
        { x: 8, y: 10 }, { x: 22, y: 6 }, { x: 36, y: 14 }, { x: 52, y: 5 }, { x: 68, y: 12 }, { x: 84, y: 8 },
        { x: 12, y: 28 }, { x: 28, y: 22 }, { x: 44, y: 30 }, { x: 60, y: 18 }, { x: 76, y: 26 }, { x: 90, y: 20 },
        { x: 6, y: 44 }, { x: 20, y: 38 }, { x: 34, y: 46 }, { x: 50, y: 36 }, { x: 66, y: 42 }, { x: 82, y: 34 },
        { x: 16, y: 16 }, { x: 40, y: 8 }, { x: 58, y: 24 }, { x: 72, y: 6 }, { x: 88, y: 40 }, { x: 30, y: 34 }
    ];

    const gameArea = document.getElementById('game-area');
    const kastensEl = document.getElementById('kastens');
    const messageEl = document.getElementById('message');
    const equationEl = document.getElementById('equation');
    const nextBtn = document.getElementById('next-btn');
    const choicesEl = document.getElementById('choices');
    const choiceRow = document.getElementById('choice-row');
    const fixGrid = document.getElementById('fix-grid');
    const sumGrid = document.getElementById('sum-grid');
    const randomLeftBtn = document.getElementById('random-left-btn');
    const fixLeftTab = document.getElementById('fix-left-tab');
    const fixRightTab = document.getElementById('fix-right-tab');
    const randomSumBtn = document.getElementById('random-sum-btn');
    const le10Btn = document.getElementById('le10-btn');
    const le5Btn = document.getElementById('le5-btn');
    const hintBtn = document.getElementById('hint-btn');
    const resetHintBtn = document.getElementById('reset-hint-btn');
    const backBtn = document.getElementById('back-btn');
    const enshuGrid = document.getElementById('enshu-grid');
    const huntGrid = document.getElementById('hunt-grid');
    const shiftStartBtn = document.getElementById('shift-start-btn');
    const shiftToRightBtn = document.getElementById('shift-to-right');
    const shiftToLeftBtn = document.getElementById('shift-to-left');
    const shiftDoneBtn = document.getElementById('shift-done-btn');
    const shiftQuitBtn = document.getElementById('shift-quit-btn');
    const changeOps = document.getElementById('change-ops');
    const changeTitle = document.getElementById('change-title');
    const changeEqFrom = document.getElementById('change-eq-from');
    const changeEqTo = document.getElementById('change-eq-to');
    const changeCaption = document.getElementById('change-caption');
    const changeQuitBtn = document.getElementById('change-quit-btn');
    const countStartBtn = document.getElementById('count-start-btn');
    const countAnimStartBtn = document.getElementById('count-anim-start-btn');
    const countContinueBtn = document.getElementById('count-continue-btn');
    const countQuitBtn = document.getElementById('count-quit-btn');
    const drillPanel = document.getElementById('drill-panel');
    const drillTitle = document.getElementById('drill-title');
    const drillList = document.getElementById('drill-list');
    const drillQuitBtn = document.getElementById('drill-quit-btn');
    const drillPrintBtn = document.getElementById('drill-print-btn');
    const printDateEl = document.getElementById('print-date');
    const printSettingsEl = document.getElementById('print-settings');
    const treeSky = document.getElementById('tree-sky');
    const canopy = document.getElementById('canopy');
    const meadow = document.getElementById('meadow');
    const starField = document.getElementById('star-field');
    const harvestMeter = document.getElementById('harvest-meter');
    const streakCaption = document.getElementById('streak-caption');

    let leftNum = 1;
    let rightNum = 1;
    let fixedDigit = null;
    let fixTarget = 'left';

    function fixedLeft() {
        return fixTarget === 'left' ? fixedDigit : null;
    }

    function fixedRight() {
        return fixTarget === 'right' ? fixedDigit : null;
    }
    let sumMode = 'random';
    let selectedSums = new Set();
    let busy = false;
    let solved = false;
    let showGrid = true;
    let showBalls = true;
    let moveMode = 'small-large';
    let leftBoxes = [];
    let rightBoxes = [];
    let hintPhase = 0;
    let lastLeft = null;
    let lastRight = null;
    let drillCount = null;
    let drillView = 'list';
    let drillItems = [];
    let drillFocus = null;
    let huntTarget = null;
    let huntView = 'list';
    let huntItems = [];
    let huntFocus = null;
    let shiftMode = false;
    let shiftGoalLeft = null;
    let changeMode = false;
    let changeOpSelected = null;
    let changeOp = null;
    let changeView = 'quiz';
    let changeStartL = 3;
    let changeStartR = 5;
    let changeNewL = 4;
    let changeNewR = 4;
    let changeBlank = 'right';
    let changeAnswer = 4;
    let countMode = false;
    let countPhase = 'idle';
    let countShown = 0;
    let apples = [];
    let solves = 0;
    let harvestDone = false;
    let streak = 0;
    let lastHarvestDate = '';

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function dateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function shiftDateKey(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        return dateKey(date);
    }

    function loadState() {
        let saved = null;
        try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (err) {
            saved = null;
        }
        const today = dateKey();
        const yesterday = shiftDateKey(-1);
        streak = Number(saved && saved.streak) || 0;
        lastHarvestDate = (saved && saved.lastHarvestDate) || '';
        if (lastHarvestDate !== today && lastHarvestDate !== yesterday) {
            streak = 0;
        }
        if (saved && saved.playDate === today) {
            apples = Array.isArray(saved.apples) ? saved.apples.slice(0, HARVEST_GOAL) : [];
            solves = Math.max(Number(saved.solves) || apples.length, apples.length);
            harvestDone = solves >= HARVEST_GOAL;
        } else {
            apples = [];
            solves = 0;
            harvestDone = false;
        }
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                playDate: dateKey(),
                apples,
                solves,
                harvestDone,
                streak,
                lastHarvestDate
            }));
        } catch (err) {
            /* ignore quota / private mode */
        }
    }

    function grassCount() {
        return Math.min(GRASS_MAX, Math.max(0, solves - HARVEST_GOAL));
    }

    function flowerCount() {
        return Math.min(FLOWER_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX));
    }

    function starCount() {
        return Math.min(STAR_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX - FLOWER_MAX));
    }

    function renderTree() {
        canopy.querySelectorAll('.tree-apple').forEach((el) => el.remove());
        apples.slice(0, HARVEST_GOAL).forEach((apple, i) => {
            const spot = APPLE_SPOTS[i];
            const el = document.createElement('div');
            el.className = 'tree-apple' + (apple.golden ? ' golden' : '');
            el.style.left = `${spot.x}%`;
            el.style.top = `${spot.y}%`;
            canopy.appendChild(el);
        });
    }

    function renderMeadow() {
        meadow.innerHTML = '';
        const grasses = grassCount();
        const flowers = flowerCount();
        for (let i = 0; i < grasses; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'grass';
            wrap.style.left = `${GRASS_SPOTS[i].x}%`;
            wrap.style.height = `${GRASS_SPOTS[i].h}px`;
            const blade = document.createElement('div');
            blade.className = 'grass-blade';
            wrap.appendChild(blade);
            if (i < flowers) {
                const bloom = document.createElement('div');
                bloom.className = `bloom hue-${i % 3}`;
                wrap.appendChild(bloom);
            }
            meadow.appendChild(wrap);
        }
    }

    function renderStars() {
        starField.innerHTML = '';
        const n = starCount();
        treeSky.classList.toggle('starry', n > 0 && n < 8);
        treeSky.classList.toggle('starry-deep', n >= 8);
        for (let i = 0; i < n; i++) {
            const star = document.createElement('div');
            star.className = 'sky-star';
            star.style.left = `${STAR_SPOTS[i].x}%`;
            star.style.top = `${STAR_SPOTS[i].y}%`;
            star.style.animationDelay = `${(i % 7) * 0.18}s`;
            starField.appendChild(star);
        }
    }

    function popLast(selector) {
        const els = treeSky.querySelectorAll(selector);
        const last = els[els.length - 1];
        if (!last) return;
        last.classList.remove('just-grew');
        void last.offsetWidth;
        last.classList.add('just-grew');
    }

    function renderHarvestMeter() {
        harvestMeter.classList.toggle('done', harvestDone);
        if (solves <= HARVEST_GOAL) {
            harvestMeter.innerHTML = `きょうのりんご <strong>${Math.min(apples.length, HARVEST_GOAL)}</strong> / ${HARVEST_GOAL}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX) {
            harvestMeter.innerHTML = `きょうのくさ <strong>${grassCount()}</strong> / ${GRASS_MAX}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            harvestMeter.innerHTML = `きょうのはな <strong>${flowerCount()}</strong> / ${FLOWER_MAX}`;
        } else {
            harvestMeter.innerHTML = `きょうのほし <strong>${starCount()}</strong>`;
        }
        streakCaption.innerHTML = `れんぞく <strong>${streak}</strong> 日`;
    }

    function refreshOrchard(grew) {
        renderTree();
        renderMeadow();
        renderStars();
        renderHarvestMeter();
        if (grew === 'grass') popLast('.grass');
        if (grew === 'flower') popLast('.bloom');
        if (grew === 'star') popLast('.sky-star');
    }

    function nextAppleSlot() {
        let index = apples.length;
        if (index >= HARVEST_GOAL) {
            const plain = apples.findIndex((apple) => !apple.golden);
            index = plain >= 0 ? plain : HARVEST_GOAL - 1;
        }
        let slot = canopy.querySelectorAll('.tree-apple')[index];
        if (!slot) {
            const spot = APPLE_SPOTS[index] || APPLE_SPOTS[0];
            slot = document.createElement('div');
            slot.className = 'tree-apple';
            slot.style.left = `${spot.x}%`;
            slot.style.top = `${spot.y}%`;
            slot.style.visibility = 'hidden';
            canopy.appendChild(slot);
        }
        return slot;
    }

    function fruitStartEl() {
        if (changeMode && changeView === 'quiz') {
            return changeEqTo.querySelector('.eq-sum') || changeEqTo;
        }
        const balls = kastensEl.querySelectorAll('.ball');
        if (showBalls && balls.length) return balls[balls.length - 1];
        return equationEl.querySelector('.eq-sum') || equationEl;
    }

    async function animateFruitToTree(golden) {
        const fromEl = fruitStartEl();
        const slot = nextAppleSlot();
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'fruit-chip' + (golden ? ' golden' : '');
        chip.style.left = `${rect.left + (rect.width - 36) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 36) / 2}px`;
        document.body.appendChild(chip);
        await flyFromTo(chip, slot);
        chip.remove();
        slot.remove();
    }

    function collectApple(golden) {
        if (apples.length < HARVEST_GOAL) {
            apples.push({ golden });
            return;
        }
        if (golden) {
            const plain = apples.findIndex((apple) => !apple.golden);
            if (plain >= 0) apples[plain].golden = true;
        }
    }

    function completeHarvest() {
        const today = dateKey();
        const yesterday = shiftDateKey(-1);
        harvestDone = true;
        if (lastHarvestDate !== today) {
            streak = lastHarvestDate === yesterday ? streak + 1 : 1;
            lastHarvestDate = today;
        }
        treeSky.classList.remove('bloom');
        void treeSky.offsetWidth;
        treeSky.classList.add('bloom');
        wait(800).then(() => treeSky.classList.remove('bloom'));
    }

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randDigit() {
        return randInt(1, 9);
    }

    function setChoicesEnabled(enabled) {
        choiceRow.querySelectorAll('.choice-btn').forEach((btn) => {
            btn.disabled = !enabled;
        });
    }

    function updateHintButton() {
        const inHint = isHintView();
        const inChangeHint = changeMode && changeView === 'hint';
        const inChangeQuiz = changeMode && changeView === 'quiz';
        const inPanel = drillCount !== null || huntTarget !== null;
        hintBtn.textContent = hintPhase === 1 ? '💡 もっとヒント' : '💡 ヒント';
        hintBtn.disabled = busy || solved || !showBalls || hintPhase >= 2;
        hintBtn.classList.toggle('hidden', solved || !showBalls || shiftMode || countMode || inChangeHint || (inChangeQuiz && !changeOp));
        resetHintBtn.disabled = busy;
        resetHintBtn.classList.toggle('hidden', solved || !showBalls || shiftMode || inChangeQuiz || (countMode ? countPhase !== 'done' : hintPhase === 0));
        backBtn.disabled = busy;
        backBtn.classList.toggle('hidden', !(inHint || inChangeHint));
        if (countAnimStartBtn) {
            countAnimStartBtn.classList.toggle('hidden', !countMode || solved || !showBalls || countPhase !== 'idle');
            countAnimStartBtn.disabled = busy;
        }
        if (countContinueBtn) {
            countContinueBtn.classList.toggle('hidden', !countMode || solved || !showBalls || countPhase !== 'labeled');
            countContinueBtn.disabled = busy;
        }
        if (countQuitBtn) {
            countQuitBtn.classList.toggle('hidden', !countMode);
            countQuitBtn.disabled = false;
        }
        drillPanel.classList.toggle('hidden', !inPanel || inHint);
        gameArea.classList.toggle('in-drill-list', inPanel && !inHint);
        gameArea.classList.toggle('in-drill-hint', inHint);
        gameArea.classList.toggle('in-change-quiz', inChangeQuiz);
        gameArea.classList.toggle('in-change-hint', inChangeHint);
        gameArea.classList.toggle('change-solved', inChangeQuiz && solved);
        gameArea.classList.toggle('in-count', countMode);
        if (enshuGrid) {
            enshuGrid.querySelectorAll('.sum-btn').forEach((btn) => {
                btn.classList.toggle('active', drillCount === Number(btn.dataset.n));
            });
        }
        if (huntGrid) {
            huntGrid.querySelectorAll('.sum-btn').forEach((btn) => {
                btn.classList.toggle('active', huntTarget === Number(btn.dataset.n));
            });
        }
        if (shiftStartBtn) shiftStartBtn.classList.toggle('active', shiftMode);
        if (countStartBtn) countStartBtn.classList.toggle('active', countMode);
        gameArea.classList.toggle('in-shift', shiftMode);
        if (shiftMode) updateShiftButtons();
        if (changeOps) {
            changeOps.querySelectorAll('[data-change]').forEach((btn) => {
                btn.classList.toggle('active', changeMode && btn.dataset.change === changeOpSelected);
            });
        }
        updateChoiceRange();
    }

    function applyDisplayMode() {
        if (!showBalls) showGrid = false;
        gameArea.classList.toggle('no-grid', !showGrid);
        gameArea.classList.toggle('no-balls', !showBalls);
        document.querySelectorAll('.ctrl-btn[data-setting]').forEach((btn) => {
            const on = btn.dataset.setting === 'grid' ? showGrid : showBalls;
            btn.classList.toggle('active', (btn.dataset.value === 'on') === on);
            if (btn.dataset.setting === 'grid') btn.disabled = !showBalls;
        });
        fixLeftTab.classList.toggle('active', fixTarget === 'left');
        fixRightTab.classList.toggle('active', fixTarget === 'right');
        randomLeftBtn.classList.toggle('active', fixedDigit === null);
        fixGrid.querySelectorAll('.fix-btn').forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.n) === fixedDigit);
        });
        randomSumBtn.classList.toggle('active', sumMode === 'random' && selectedSums.size === 0);
        le10Btn.classList.toggle('active', sumMode === 'le10');
        le5Btn.classList.toggle('active', sumMode === 'le5');
        sumGrid.querySelectorAll('.sum-btn').forEach((btn) => {
            btn.classList.toggle('active', selectedSums.has(Number(btn.dataset.n)));
        });
        document.querySelectorAll('.move-btn').forEach((btn) => {
            btn.classList.toggle('active', btn.dataset.move === moveMode);
        });
        refreshEquation();
        updateHintButton();
    }

    function updateChoiceRange() {
        if (!choiceRow) return;
        choiceRow.querySelectorAll('.choice-btn').forEach((btn) => {
            const n = Number(btn.dataset.n);
            btn.classList.toggle('hidden', changeMode && n > 9);
        });
    }

    function refreshEquation(sumValue = null) {
        const rightPart = `<span class="eq-blue">${rightNum}</span>`;
        const leftPart = `<span class="eq-red">${leftNum}</span>`;
        if (shiftMode || changeMode) {
            equationEl.innerHTML = `${leftPart} + ${rightPart} = <span class="eq-sum">${leftNum + rightNum}</span>`;
            return;
        }
        if (solved && sumValue === null) {
            equationEl.innerHTML = `${leftPart} + ${rightPart} = <span class="eq-sum">${leftNum + rightNum}</span>`;
            return;
        }
        if (sumValue !== null) {
            equationEl.innerHTML = `${leftPart} + ${rightPart} = <span class="eq-sum">${sumValue}</span>`;
            return;
        }
        equationEl.innerHTML = `${leftPart} + ${rightPart} = <span class="eq-blank">□</span>`;
    }

    function makeBox() {
        const box = document.createElement('div');
        box.className = 'box';
        return box;
    }

    function buildKasten(count, colorClass) {
        const wrap = document.createElement('div');
        wrap.className = 'kasten';
        const topRow = document.createElement('div');
        topRow.className = 'kasten-row';
        const bottomRow = document.createElement('div');
        bottomRow.className = 'kasten-row';
        const boxes = [];

        for (let i = 0; i < 5; i++) {
            const box = makeBox();
            bottomRow.appendChild(box);
            boxes.push(box);
        }
        for (let i = 0; i < 5; i++) {
            const box = makeBox();
            topRow.appendChild(box);
            boxes.push(box);
        }

        wrap.appendChild(topRow);
        wrap.appendChild(bottomRow);

        for (let i = 0; i < count; i++) {
            const ball = document.createElement('div');
            ball.className = `ball ${colorClass} landed`;
            boxes[i].appendChild(ball);
        }
        return { el: wrap, boxes };
    }

    function renderKastens() {
        kastensEl.innerHTML = '';
        const left = buildKasten(leftNum, 'red');
        const right = buildKasten(rightNum, 'blue');
        leftBoxes = left.boxes;
        rightBoxes = right.boxes;

        const leftWrap = document.createElement('div');
        leftWrap.className = 'kasten-wrap';
        leftWrap.appendChild(left.el);

        const plus = document.createElement('div');
        plus.className = 'plus';
        plus.textContent = '+';

        const rightWrap = document.createElement('div');
        rightWrap.className = 'kasten-wrap';
        rightWrap.appendChild(right.el);

        kastensEl.appendChild(leftWrap);
        kastensEl.appendChild(plus);
        kastensEl.appendChild(rightWrap);
    }

    function promptMessage() {
        return `あか の <strong>${leftNum}</strong> と あお の <strong>${rightNum}</strong>。<br>あわせて いくつ？`;
    }

    function pairFitsSum(l, r) {
        const s = l + r;
        if (selectedSums.size > 0) return selectedSums.has(s);
        if (sumMode === 'le10') return s <= 10;
        if (sumMode === 'le5') return s <= 5;
        return true;
    }

    function choosePair(pairs) {
        let choices = pairs;
        if (lastLeft !== null && pairs.length > 1) {
            const filtered = pairs.filter(([l, r]) => l !== lastLeft || r !== lastRight);
            if (filtered.length) choices = filtered;
        }
        const picked = choices[randInt(0, choices.length - 1)];
        lastLeft = picked[0];
        lastRight = picked[1];
        return picked;
    }

    function uniquePairs(pairs) {
        const seen = new Set();
        const unique = [];
        for (const [l, r] of pairs) {
            if (l < 1 || r < 1 || l > 9 || r > 9) continue;
            const key = `${l}+${r}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push([l, r]);
        }
        return unique;
    }

    function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function collectPairs() {
        const MIN = 1;
        const MAX = 9;
        const pairs = [];
        const lefts = fixedLeft() === null
            ? Array.from({ length: MAX - MIN + 1 }, (_, i) => i + MIN)
            : [fixedLeft()];
        const rights = fixedRight() === null
            ? Array.from({ length: MAX - MIN + 1 }, (_, i) => i + MIN)
            : [fixedRight()];

        for (const l of lefts) {
            for (const r of rights) {
                if (pairFitsSum(l, r)) pairs.push([l, r]);
            }
        }

        if (pairs.length === 0 && fixedDigit !== null) {
            for (const l of lefts) {
                for (const r of rights) {
                    pairs.push([l, r]);
                }
            }
        }

        if (pairs.length === 0 && (selectedSums.size > 0 || sumMode === 'le10' || sumMode === 'le5')) {
            for (let l = MIN; l <= MAX; l++) {
                for (let r = MIN; r <= MAX; r++) {
                    if (pairFitsSum(l, r)) pairs.push([l, r]);
                }
            }
        }

        if (pairs.length === 0 && selectedSums.size > 0) {
            for (const sum of selectedSums) {
                for (let l = MIN; l <= MAX; l++) {
                    const r = sum - l;
                    if (r >= MIN && r <= MAX) pairs.push([l, r]);
                }
            }
        }

        if (pairs.length === 0) {
            pairs.push([
                fixedLeft() === null ? randDigit() : fixedLeft(),
                fixedRight() === null ? randDigit() : fixedRight()
            ]);
        }
        return uniquePairs(pairs);
    }

    function pickUniqueSet(n) {
        const pool = shuffleInPlace(collectPairs());
        return pool.slice(0, Math.max(1, Math.min(n, pool.length)));
    }

    function allAddendPairs() {
        const MIN = 1;
        const MAX = 9;
        const lefts = fixedLeft() === null
            ? Array.from({ length: MAX - MIN + 1 }, (_, i) => i + MIN)
            : [fixedLeft()];
        const rights = fixedRight() === null
            ? Array.from({ length: MAX - MIN + 1 }, (_, i) => i + MIN)
            : [fixedRight()];
        const pairs = [];
        for (const l of lefts) {
            for (const r of rights) {
                pairs.push([l, r]);
            }
        }
        const unique = uniquePairs(pairs);
        if (unique.length) return unique;
        const fallback = [];
        for (let l = MIN; l <= MAX; l++) {
            for (let r = MIN; r <= MAX; r++) {
                fallback.push([l, r]);
            }
        }
        return uniquePairs(fallback);
    }

    function pickHuntSet(target, n = 20) {
        const bands = new Map();
        for (const [l, r] of allAddendPairs()) {
            const dist = Math.abs(l + r - target);
            if (!bands.has(dist)) bands.set(dist, []);
            bands.get(dist).push([l, r]);
        }
        const picked = [];
        const distances = [...bands.keys()].sort((a, b) => a - b);
        for (const dist of distances) {
            if (picked.length >= n) break;
            const band = shuffleInPlace(bands.get(dist));
            picked.push(...band);
        }
        return shuffleInPlace(picked.slice(0, Math.max(1, Math.min(n, picked.length))));
    }

    function pickAddends() {
        return choosePair(collectPairs());
    }

        const item = huntItems[index];
        if (!item || item.revealed || busy) return;
        huntFocus = index;

        const isTreasure = item.left + item.right === huntTarget;

        choicesEl.classList.remove('hidden');

        const hunting = huntTarget !== null;
        const items = hunting ? huntItems : drillItems;
        const item = items[index];

        if (!hunting && item.solved) return;
        if (hunting) {

            huntView = 'hint';

            drillFocus = index;
            drillView = 'hint';

        rightNum = item.right;
